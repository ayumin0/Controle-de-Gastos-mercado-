const ICONS={grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',list:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',card:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>',repeat:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',activity:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20V8"/>',settings:'<path d="M12 2l1.7 2.9 3.3.2.9 3.2 2.9 1.7-1 3.1.9 3.1-2.9 1.7-.9 3.2-3.3.2L12 22l-1.7-2.9-3.3-.2-.9-3.2-2.9-1.7 1-3.1-.9-3.1 2.9-1.7.9-3.2 3.3-.2z"/><circle cx="12" cy="12" r="3"/>',plus:'<path d="M12 5v14M5 12h14"/>',chevLeft:'<path d="M15 18l-6-6 6-6"/>',chevRight:'<path d="M9 18l6-6-6-6"/>',moon:'<path d="M20 15.7A9 9 0 018.3 4 9 9 0 1020 15.7z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',x:'<path d="M18 6L6 18M6 6l12 12"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',wallet:'<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18M16 14h2"/>',receipt:'<path d="M5 3h14v18l-3-2-4 2-4-2-3 2V3zM9 8h6M9 12h6"/>',basket:'<path d="M3 10h18l-2 10H5L3 10zM8 10l4-7 4 7M9 13v4M15 13v4"/>',food:'<path d="M4 3v8m3-8v8M2 7h7M6 11v10M16 3v18M16 3c5 0 6 8 0 10"/>',bag:'<path d="M4 8h16l-1 13H5L4 8zM9 9V6a3 3 0 016 0v3"/>',car:'<path d="M5 11l2-6h10l2 6M4 11h16v7H4zM6 18v2m12-2v2M7 14h2m6 0h2"/>',heart:'<path d="M20.8 5.5a5.5 5.5 0 00-7.8 0L12 6.6l-1.1-1.1a5.5 5.5 0 00-7.8 7.8L12 21l8.8-8.8a5.5 5.5 0 000-7.8z"/>',book:'<path d="M4 3h16v18H6a2 2 0 01-2-2zM4 17h16M8 7h8"/>',spark:'<path d="M12 2l2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3L12 2z"/>',game:'<path d="M7 7h10a5 5 0 015 5l-1 6a3 3 0 01-5 1l-2-2h-4l-2 2a3 3 0 01-5-1l-1-6a5 5 0 015-5zM6 12h5m-2.5-2.5v5M16 11h.01M19 14h.01"/>',gift:'<rect x="3" y="9" width="18" height="12" rx="1"/><path d="M2 9h20M12 9v12M12 9c-8 0-8-7-4-7 3 0 4 4 4 7zm0 0c8 0 8-7 4-7-3 0-4 4-4 7z"/>',dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/>',trash:'<path d="M4 7h16M9 7V4h6v3m-9 0 1 14h10l1-14M10 11v6m4-6v6"/>',edit:'<path d="M4 20l4.5-1 11-11a2 2 0 00-3-3l-11 11L4 20z"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 19v2h16v-2"/>',upload:'<path d="M12 17V4m-5 5 5-5 5 5M4 19v2h16v-2"/>',check:'<path d="M4 12l5 5L20 6"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 10v7M12 6h.01"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>',trend:'<path d="M3 17l7-7 4 4 7-7M15 7h6v6"/>',swap:'<path d="M4 7h16l-4-4m4 4-4 4M20 17H4l4-4m-4 4 4 4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',alert:'<path d="M12 3l10 18H2L12 3zM12 9v5m0 3h.01"/>',refresh:'<path d="M20 8A8 8 0 105 18M20 3v5h-5M4 16a8 8 0 0015-9M4 21v-5h5"/>',filter:'<path d="M4 5h16l-6 7v7l-4 2v-9L4 5z"/>',external:'<path d="M14 4h6v6M20 4l-9 9M19 14v6H4V5h6"/>',layers:'<path d="M12 3l9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/>'};
function icon(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.dots}</svg>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(cents){return (Number(cents||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function num(cents){return (Number(cents||0)/100).toFixed(2)}
function toCents(v){if(typeof v==='number')return Math.round(v*100);let s=String(v??'').trim().replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');let x=Number(s);return Number.isFinite(x)?Math.round(x*100):NaN}
function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function monthOf(d){return String(d||'').slice(0,7)}
function monthShift(m,n){const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function formatMonth(m){const [y,mo]=(m||localToday().slice(0,7)).split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase())}
function displayDate(d){if(!d)return '—';const [y,m,day]=d.split('-');return `${day}/${m}/${y}`}
function lastDay(m){const [y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()}
function pad(n){return String(n).padStart(2,'0')}
function clampDate(m,day){return `${m}-${pad(Math.min(Math.max(Number(day),1),lastDay(m)))}`}
function makeId(){return `${Date.now().toString(36)}_${Math.random().toString(36).slice(2,9)}`}
function defaultData(){return {version:1,transactions:[],settlements:[],recurring:[],budgets:{},salary:[{from:'2026-01',amount:250000}],cards:[{id:'mine',name:'Meu cartão',closing:25,due:5},{id:'dad',name:'Cartão do meu pai',closing:25,due:5}],billPaid:{},customCategories:[],savingsTarget:0,theme:'light'}}
function loadData(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(!v||!Array.isArray(v.transactions))return defaultData();const base=defaultData();return {...base,...v,cards:Array.isArray(v.cards)&&v.cards.length===2?v.cards:base.cards,transactions:v.transactions,settlements:Array.isArray(v.settlements)?v.settlements:[],recurring:Array.isArray(v.recurring)?v.recurring:[],salary:Array.isArray(v.salary)&&v.salary.length?v.salary:base.salary,budgets:v.budgets||{},billPaid:v.billPaid||{},customCategories:Array.isArray(v.customCategories)?v.customCategories:[]}}catch(e){console.warn('Não foi possível abrir os dados locais',e);return defaultData()}}
let data=loadData();let view='overview';let selectedMonth=monthOf(localToday());let modalType=null;let editingId=null;let transFilters={search:'',category:'all',card:'all',responsibility:'all'};let toastTimer;let confirmReset=false;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));return true}catch(e){notify('Não foi possível salvar. Libere espaço ou faça backup.',true);return false}}
function notify(message,isError=false){const el=document.getElementById('toast');el.innerHTML=`${icon(isError?'alert':'check',16)} <span>${esc(message)}</span>`;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3600)}
function cats(){return [...CATEGORY_DEFAULTS,...data.customCategories]}
function getCat(id){return cats().find(c=>c.id===id)||CATEGORY_DEFAULTS[CATEGORY_DEFAULTS.length-1]}
function catIcon(id){const c=getCat(id);return `<span class="category-icon" style="background:${c.color}1b;color:${c.color}">${icon(c.icon,17)}</span>`}
function getCard(id){return data.cards.find(c=>c.id===id)||data.cards[0]}
function income(month){return [...data.salary].sort((a,b)=>a.from.localeCompare(b.from)).filter(x=>x.from<=month).at(-1)?.amount??data.salary[0].amount}
function sum(arr,fn){return arr.reduce((a,x)=>a+(fn?fn(x):x),0)}
function consumption(month){return data.transactions.filter(t=>monthOf(t.date)===month)}
function portions(value,count){const base=Math.floor(value/count),rem=value%count;return Array.from({length:count},(_,i)=>base+(i<rem?1:0))}
function dueMonth(date,card){const m=monthOf(date),d=Number(date.slice(8)),closeMonth=d<=Math.min(card.closing,lastDay(m))?m:monthShift(m,1);return card.due>card.closing?closeMonth:monthShift(closeMonth,1)}
function schedule(tx){const n=Math.max(1,Math.min(120,Number(tx.installments)||1));const start=dueMonth(tx.date,getCard(tx.card));const p=portions(tx.amount,n),mine=portions(tx.mine,n);return p.map((v,i)=>({tx,card:tx.card,month:monthShift(start,i),amount:v,mine:mine[i],dad:v-mine[i],i:i+1,n}))}
function invalidateBillStatus(tx){if(!tx)return;for(const entry of schedule(tx))delete data.billPaid[`${tx.card}:${entry.month}`]}
function billEntries(month,cardId){return data.transactions.filter(t=>t.card===cardId).flatMap(t=>schedule(t).filter(x=>x.month===month))}
function billStats(month,card){const entries=billEntries(month,card);return {entries,total:sum(entries,e=>e.amount),mine:sum(entries,e=>e.mine),dad:sum(entries,e=>e.dad)}}
function monthlyDue(month){const mine=billStats(month,'mine'),dad=billStats(month,'dad');return {total:mine.total+dad.total,mine:mine.mine+dad.mine,dad:mine.dad+dad.dad}}
function totalBy(list,field='amount'){return sum(list,t=>t[field]||0)}
function totals(month){const t=consumption(month);return {total:totalBy(t),mine:totalBy(t,'mine'),dad:sum(t,x=>x.amount-x.mine),myCard:sum(t,x=>x.card==='mine'?x.amount:0),dadCard:sum(t,x=>x.card==='dad'?x.amount:0),count:t.length}}
function groupCat(list,owner='total'){const out=new Map();list.forEach(t=>{let amount=owner==='mine'?t.mine:owner==='dad'?t.amount-t.mine:t.amount;out.set(t.category,(out.get(t.category)||0)+amount)});return [...out.entries()].map(([id,value])=>({id,name:getCat(id).name,value,color:getCat(id).color})).sort((a,b)=>b.value-a.value)}
function favoriteCard(category,sub){const s=String(sub||'').toLocaleLowerCase('pt-BR');if(category==='contas'){if(s.includes('energia')||s.includes('aluguel'))return 'dad';if(['água','agua','gás','gas','internet'].some(x=>s.includes(x)))return 'mine'}if(category==='transporte'&&s.includes('uber'))return 'dad';return ''}
function updateCardHint(){const out=document.getElementById('cardHint'),cat=document.getElementById('expCategory')?.value,date=document.getElementById('expDate')?.value;if(!out)return;if(!['mercado','ifood'].includes(cat)||!date){out.textContent='';return}const options=data.cards.map(c=>({card:c,month:dueMonth(date,c),value:billStats(dueMonth(date,c),c.id).total})).sort((a,b)=>a.value-b.value);if(options[0])out.textContent=` Para equilibrar: ${options[0].card.name} tem ${money(options[0].value)} lançado na próxima fatura (${formatMonth(options[0].month)}), contra ${money(options[1].value)} no outro cartão. Esta é apenas uma sugestão.`}
function acrossDue(month){let owedMine=0,owedDad=0;for(const t of data.transactions){for(const p of schedule(t)){if(p.month<=month){if(t.card==='dad')owedMine+=p.mine;else owedDad+=p.dad}}}for(const s of data.settlements){if(monthOf(s.date)<=month){if(s.from==='mine')owedMine-=s.amount;else owedDad-=s.amount}}return {owedMine,owedDad,net:owedMine-owedDad}}
function recurringIsDue(r,month){if(!r.active||r.start>month)return false;if(r.frequency==='yearly')return Number(r.start.slice(5))===Number(month.slice(5));return true}
function recurringPending(month){return data.recurring.filter(r=>recurringIsDue(r,month)&&!data.transactions.some(t=>t.recurringId===r.id&&t.recurringMonth===month))}
function renderNav(){let h='<div class="nav-label">PAINEL</div>';NAV.forEach((n,i)=>{if(i===4)h+='<div class="nav-label">ANÁLISE E PLANEJAMENTO</div>';if(i===7)h+='<div class="nav-label">SISTEMA</div>';h+=`<button class="nav-btn ${view===n.id?'active':''}" data-nav="${n.id}">${icon(n.icon,18)}<span>${n.label}</span></button>`});document.getElementById('nav').innerHTML=h}
function renderShell(){const nav=NAV.find(n=>n.id===view)||NAV[0];document.getElementById('pageTitle').textContent=nav.label;document.getElementById('pageEyebrow').textContent='Seu dinheiro, com clareza';document.getElementById('monthLabel').textContent=formatMonth(selectedMonth);document.body.classList.toggle('dark',data.theme==='dark');document.getElementById('themeButton').innerHTML=icon(data.theme==='dark'?'sun':'moon');renderNav()}
function go(next){view=next;transFilters={search:'',category:'all',card:'all',responsibility:'all'};document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').classList.remove('visible');render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){renderShell();const h={overview:renderOverview,transactions:renderTransactions,cards:renderCards,recurring:renderRecurring,budgets:renderBudgets,habits:renderHabits,reports:renderReports,settings:renderSettings};document.getElementById('content').innerHTML=(h[view]||h.overview)()+'<div class="footer-banner">Nexo Finanças · Armazenamento local neste navegador · Faça backups periódicos em Configurações.</div>'}
function empty(message='Nenhuma informação neste período.',desc='Registre seus gastos para preencher automaticamente os indicadores.',withButton=false){return `<div class="empty"><div class="empty-icon">${icon('layers',21)}</div><strong>${esc(message)}</strong><p>${esc(desc)}</p>${withButton?`<button class="button primary small" data-action="add">${icon('plus')} Adicionar gasto</button>`:''}</div>`}
function panel(title,subtitle,body,actions=''){return `<section class="panel"><div class="panel-head"><div><h2 class="panel-title">${title}</h2>${subtitle?`<div class="panel-sub">${subtitle}</div>`:''}</div>${actions}</div>${body}</section>`}
function kpi(label,value,sub,ic,color='',valueClass=''){return `<div class="kpi"><div class="kpi-top"><span>${label}</span><span class="kpi-icon ${color}">${icon(ic,18)}</span></div><div class="kpi-value ${valueClass}">${value}</div><div class="kpi-bottom">${sub}</div></div>`}
function roundPct(n,d){return d?Math.round(100*n/d):0}
function horizontalBar(values,maxValue){return values.map(x=>`<div class="rank-line"><span class="rank-num">${x.index||''}</span><div class="rank-body"><div class="rank-label"><span>${esc(x.label)}</span><small>${esc(x.sub||'')}</small></div><div class="thin-progress"><span style="width:${Math.max(x.value>0?2:0,roundPct(x.value,maxValue))}%;background:${x.color||'var(--primary)'}"></span></div></div><span class="rank-amount">${money(x.value)}</span></div>`).join('')}
function donutChart(groups,centerValue){const all=sum(groups,x=>x.value);if(!all)return empty('Ainda não há gastos','As categorias aparecerão aqui após o primeiro lançamento.');let offset=0;const rings=groups.map(g=>{const len=g.value/all*100;const circle=`<circle cx="85" cy="85" r="64" fill="none" stroke="${g.color}" stroke-width="20" stroke-dasharray="${len} ${100-len}" stroke-dashoffset="${-offset}" pathLength="100" transform="rotate(-90 85 85)"><title>${esc(g.name)}: ${money(g.value)}</title></circle>`;offset+=len;return circle}).join('');const legend=groups.slice(0,6).map(g=>`<div class="legend-item"><span class="legend-name"><span class="dot" style="background:${g.color}"></span><span>${esc(g.name)}</span></span><b>${money(g.value)}</b></div>`).join('');return `<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 170 170" role="img" aria-label="Distribuição de despesas"><circle cx="85" cy="85" r="64" fill="none" stroke="var(--border)" stroke-width="20"/>${rings}</svg><div class="donut-center"><strong>${money(centerValue??all)}</strong><span>Total registrado</span></div></div><div class="legend">${legend}${groups.length>6?`<small class="muted">+ ${groups.length-6} categorias</small>`:''}</div></div>`}
function lineGraph(month,days){const totalDays=lastDay(month),points=Array.from({length:totalDays},(_,i)=>days[i+1]||0),max=Math.max(1,...points),w=700,h=230,padX=28,top=18,bottom=190;const xy=points.map((v,i)=>[padX+i/(totalDays-1)*(w-padX-15),bottom-v/max*(bottom-top)]);const poly=xy.map(p=>p.join(',')).join(' '),area=`${padX},${bottom} ${poly} ${xy.at(-1)[0]},${bottom}`;const grid=[0,.25,.5,.75,1].map(v=>{const y=bottom-v*(bottom-top);return `<line x1="${padX}" y1="${y}" x2="${w}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 4"/><text x="0" y="${y+4}" class="chart-label">${v===0?'0':Math.round(max*v/100).toLocaleString('pt-BR')}</text>`}).join('');const labels=[1,Math.round(totalDays/4),Math.round(totalDays/2),Math.round(totalDays*.75),totalDays].map(d=>`<text x="${xy[d-1][0]}" y="218" text-anchor="middle" class="chart-label">${pad(d)}</text>`).join('');return `<div class="chart-box"><svg viewBox="0 0 720 235" preserveAspectRatio="none" role="img" aria-label="Evolução diária dos gastos"><defs><linearGradient id="trendFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#767af8" stop-opacity=".24"/><stop offset="100%" stop-color="#767af8" stop-opacity="0"/></linearGradient></defs>${grid}<polygon points="${area}" fill="url(#trendFill)"/><polyline points="${poly}" fill="none" stroke="#7275f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${xy.map((p,i)=>points[i]>0?`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#656be9" stroke="var(--surface)" stroke-width="2"><title>Dia ${i+1}: ${money(points[i])}</title></circle>`:'').join('')}${labels}</svg></div>`}
function overviewTxRows(list){if(!list.length)return empty('Nenhum gasto lançado',`O mês de ${formatMonth(selectedMonth).toLowerCase()} ainda está sem registros.`,true);return `<div class="table-wrap"><table class="table"><thead><tr><th>Descrição</th><th>Data</th><th>Cartão</th><th>Responsabilidade</th><th class="text-right">Total</th></tr></thead><tbody>${list.map(t=>`<tr><td><div class="transaction-name">${catIcon(t.category)}<div class="name-ellipsis"><strong>${esc(t.description)}</strong><small>${esc(getCat(t.category).name)}${t.merchant?' · '+esc(t.merchant):''}</small></div></div></td><td>${displayDate(t.date)}</td><td><span class="pill ${t.card==='mine'?'purple':''}">${t.card==='mine'?'Meu':'Pai'}</span></td><td>${t.mine===t.amount?'Eu':t.mine===0?'Pai':`${money(t.mine)} / ${money(t.amount-t.mine)}`}</td><td class="text-right amount-main">${money(t.amount)}</td></tr>`).join('')}</tbody></table></div>`}
function tipsFor(month){const t=consumption(month),prev=consumption(monthShift(month,-1)),out=[];const prevTotal=totalBy(prev),total=totalBy(t);if(t.length&&prevTotal>0){const change=Math.round((total-prevTotal)/prevTotal*100);out.push({title:`Gastos ${change>=0?'aumentaram':'diminuíram'} ${Math.abs(change)}%`,body:`Comparação entre ${formatMonth(month)} e ${formatMonth(monthShift(month,-1))}.`,icon:'trend'})}for(const id of ['ifood','mercado']){const arr=t.filter(x=>x.category===id);if(arr.length)out.push({title:`${arr.length} ${id==='ifood'?'pedidos de delivery':'compras no mercado'}`,body:`Média por compra: ${money(Math.round(totalBy(arr)/arr.length))}.`,icon:id==='ifood'?'food':'basket'})}const mine=totals(month).mine;const pay=income(month);if(pay&&mine/pay>=.8)out.push({title:'Atenção ao seu orçamento',body:`Suas compras sob responsabilidade própria representam ${roundPct(mine,pay)}% da renda de referência.`,icon:'alert'});if(!out.length)out.push({title:'Comece pelo primeiro lançamento',body:'Registre mercado, delivery, contas ou compras online. Seus insights aparecerão conforme os dados crescerem.',icon:'info'});return out.slice(0,4).map(t=>`<div class="tip"><span class="tip-icon">${icon(t.icon,15)}</span><span class="tip-body"><strong>${esc(t.title)}</strong>${esc(t.body)}</span></div>`).join('')}
function renderOverview(){const m=selectedMonth,stat=totals(m),due=monthlyDue(m),salary=income(m),balance=salary-due.mine;const bycat=groupCat(consumption(m));const days={};consumption(m).forEach(t=>{const d=Number(t.date.slice(8));days[d]=(days[d]||0)+t.amount});const rows=[...consumption(m)].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);const pend=recurringPending(m),splitPct=roundPct(stat.mine,stat.total);return `<p class="intro">Acompanhe o consumo da casa, suas responsabilidades e os valores que chegam às faturas, tudo em um só lugar.</p><div class="kpis">${kpi('Renda mensal',money(salary),'Valor configurado para este mês','wallet')}${kpi('Consumo total',money(stat.total),`${stat.count} lançamento(s) na data da compra`,'receipt','orange')}${kpi('Minha responsabilidade',money(stat.mine),'Minha parcela das compras deste mês','card','pink')}${kpi('Saldo após faturas',money(balance),`${money(due.mine)} da minha responsabilidade vence neste mês`,'trend','green',balance<0?'neg':'positive')}</div><div class="section-grid">${panel('Evolução dos gastos','Valores diários por data de compra · '+formatMonth(m),lineGraph(m,days))}${panel('Gastos por categoria','Distribuição do consumo da residência',donutChart(bycat,stat.total))}</div><div class="section-grid even">${panel('Quem paga o quê?','Divisão da responsabilidade sobre compras realizadas neste mês',`<div class="split-legend"><div><span class="dot" style="background:#5a6af2"></span> Minha parcela<strong>${money(stat.mine)}</strong></div><div style="text-align:right"><span class="dot" style="background:#38c3ac"></span> Parcela do meu pai<strong>${money(stat.dad)}</strong></div></div><div class="split-track"><span style="width:${splitPct}%"></span><span style="width:${stat.total?100-splitPct:0}%"></span></div><div class="stat-strip"><div class="stat-item"><small>Gastos no meu cartão</small><b>${money(stat.myCard)}</b></div><div class="stat-item"><small>Gastos no cartão dele</small><b>${money(stat.dadCard)}</b></div></div>`)}${panel('Faturas e vencimentos','Parcelas previstas para pagamento em '+formatMonth(m),`<div class="mini-stat"><label>Total das duas faturas</label><strong>${money(due.total)}</strong></div><div class="stat-strip"><div class="stat-item"><small>Minha parte</small><b>${money(due.mine)}</b></div><div class="stat-item"><small>Parte do meu pai</small><b>${money(due.dad)}</b></div></div>${pend.length?`<div class="notice warning mt-16">Existem ${pend.length} recorrência(s) ainda não lançadas neste mês. Elas não entram no saldo acima até serem registradas.</div>`:''}<div class="overview-foot"><span class="tiny-text muted">As compras parceladas entram nas faturas conforme o vencimento.</span><button class="button subtle small" data-nav="cards">Ver faturas ${icon('arrow',14)}</button></div>`)}</div><div class="section-grid">${panel('Últimos lançamentos','Despesas registradas neste mês',overviewTxRows(rows),`<button class="button ghost small" data-nav="transactions">Ver todos ${icon('arrow',14)}</button>`)}${panel('Insights do seu mês','Análises automáticas baseadas nos seus registros',`<div class="tips">${tipsFor(m)}</div>`)}</div>`}
function renderTransactions(){const t=consumption(selectedMonth).filter(x=>(transFilters.category==='all'||x.category===transFilters.category)&&(transFilters.card==='all'||x.card===transFilters.card)&&(transFilters.responsibility==='all'||(transFilters.responsibility==='mine'?x.mine>0:x.amount-x.mine>0))&&`${x.description} ${x.merchant||''} ${x.subcategory||''} ${x.notes||''}`.toLocaleLowerCase('pt-BR').includes(transFilters.search.toLocaleLowerCase('pt-BR'))).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt?.localeCompare(a.createdAt||'')||0);const all=totalBy(t),mine=totalBy(t,'mine');return `<p class="intro">Filtre os lançamentos, consulte os produtos de cada compra e ajuste as parcelas ou a divisão financeira.</p><div class="kpis">${kpi('Lançamentos',String(t.length),'No período e filtros selecionados','list')}${kpi('Valor das compras',money(all),'Despesas por data da compra','basket','orange')}${kpi('Minha parte',money(mine),'Responsabilidade atribuída a mim','wallet','pink')}${kpi('Parte do meu pai',money(all-mine),'Responsabilidade atribuída a ele','card','green')}</div><section class="panel mt-20"><div class="panel-head"><div><h2 class="panel-title">Histórico de despesas</h2><div class="panel-sub">Selecione uma despesa para editar suas informações</div></div><button class="button primary small" data-action="add">${icon('plus')} Novo gasto</button></div><div class="toolbar"><div class="search-holder">${icon('search')}<input class="input search" id="searchExpenses" type="search" placeholder="Buscar compra, loja, item..." value="${esc(transFilters.search)}"></div><select class="select" id="filterCategory" aria-label="Filtrar categoria"><option value="all">Todas as categorias</option>${cats().map(c=>`<option value="${c.id}" ${transFilters.category===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select class="select" id="filterCard"><option value="all">Ambos os cartões</option><option value="mine" ${transFilters.card==='mine'?'selected':''}>Meu cartão</option><option value="dad" ${transFilters.card==='dad'?'selected':''}>Cartão do pai</option></select><select class="select" id="filterOwner"><option value="all">Todas as responsabilidades</option><option value="mine" ${transFilters.responsibility==='mine'?'selected':''}>Minha responsabilidade</option><option value="dad" ${transFilters.responsibility==='dad'?'selected':''}>Responsabilidade do pai</option></select></div>${t.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Despesa</th><th>Data</th><th>Cartão</th><th>Parcelas</th><th>Sua parte</th><th class="text-right">Total</th><th class="text-right">Ações</th></tr></thead><tbody>${t.map(x=>`<tr><td><div class="transaction-name">${catIcon(x.category)}<div class="name-ellipsis"><strong>${esc(x.description)}</strong><small>${esc(getCat(x.category).name)}${x.subcategory?' · '+esc(x.subcategory):''}${x.merchant?' · '+esc(x.merchant):''}${x.items?.length?' · '+x.items.length+' item(ns)':''}${x.usageValue!=null?' · '+x.usageValue.toLocaleString('pt-BR')+' '+esc(x.usageUnit):''}</small></div></div></td><td>${displayDate(x.date)}</td><td><span class="pill ${x.card==='mine'?'purple':''}">${x.card==='mine'?'Meu':'Pai'}</span></td><td>${x.installments>1?`${x.installments} × ${money(Math.floor(x.amount/x.installments))}`:'À vista'}</td><td>${money(x.mine)}</td><td class="text-right amount-main">${money(x.amount)}</td><td><div class="tiny-actions"><button class="button ghost tiny" data-action="edit-expense" data-id="${esc(x.id)}" aria-label="Editar">${icon('edit',15)}</button><button class="button ghost tiny" data-action="delete-expense" data-id="${esc(x.id)}" aria-label="Excluir" style="color:var(--danger)">${icon('trash',15)}</button></div></td></tr>`).join('')}</tbody></table></div>`:empty('Nenhuma despesa encontrada','Tente outro filtro ou lance uma despesa.',true)}<div class="overview-foot"><span class="tiny-text muted">${t.length} lançamento(s) · ${money(all)} em consumo</span><div class="flex-align"><button class="button outline small" data-action="export-csv">${icon('download')} Exportar CSV</button><button class="button outline small" data-action="import-click">${icon('upload')} Importar CSV</button></div></div></section>`}
function renderCards(){const m=selectedMonth,bs=monthlyDue(m),balances=acrossDue(m);return `<p class="intro">O cartão usado determina onde a compra aparece; a responsabilidade financeira determina quem deve pagar.</p><div class="kpis">${kpi('Faturas do mês',money(bs.total),'Soma das parcelas com vencimento no mês','receipt')}${kpi('Minha responsabilidade',money(bs.mine),'Minha parte das faturas do mês','wallet','pink')}${kpi('Responsabilidade do pai',money(bs.dad),'Parte dele nas faturas do mês','card','green')}${kpi('Acerto líquido acumulado',money(Math.abs(balances.net)),balances.net>0?'Você deve ao seu pai':balances.net<0?'Seu pai deve a você':'Nenhum acerto líquido pendente','swap','orange')}</div><div class="card-grid mt-20">${data.cards.map(card=>{const stat=billStats(m,card.id);const paid=data.billPaid[`${card.id}:${m}`];return `<section class="panel"><div class="credit-card ${card.id}"><div class="card-head"><span>${esc(card.name)}</span>${icon('card',23)}</div><div><small>Valor previsto da fatura</small><div class="card-total">${money(stat.total)}</div><small>${formatMonth(m)}</small></div><div class="card-foot"><span>Fecha dia ${card.closing} · Vence dia ${card.due}</span><span>${paid?'PAGA':'PREVISTA'}</span></div></div><div class="card-detail"><div class="mini-stat"><label>Minha responsabilidade</label><strong>${money(stat.mine)}</strong></div><div class="mini-stat"><label>Responsabilidade do pai</label><strong>${money(stat.dad)}</strong></div></div><div class="flex-between mt-16"><div><strong class="subheading">Lançamentos da fatura</strong><div class="tiny-text muted">${stat.entries.length} parcela(s)</div></div><button class="button ${paid?'subtle':'outline'} small" data-action="toggle-paid" data-card="${card.id}" ${stat.total<=0?'disabled':''}>${icon(paid?'check':'clock',15)} ${paid?'Marcar pendente':'Marcar paga'}</button></div><div class="statement-list">${stat.entries.length?stat.entries.sort((a,b)=>a.tx.date.localeCompare(b.tx.date)).map(p=>`<div class="statement-row"><div><strong>${esc(p.tx.description)}</strong><small>${esc(getCat(p.tx.category).name)} · ${p.n>1?`Parcela ${p.i}/${p.n}`:'À vista'}</small></div><strong>${money(p.amount)}</strong></div>`).join(''):empty('Sem parcelas neste mês','Compras futuras aparecerão conforme a data de fechamento.')}</div></section>`}).join('')}</div><div class="section-grid even">${panel('Acertos entre os cartões','Obrigações acumuladas até o fim do mês selecionado (menos reembolsos)',`<div class="mini-stat"><label>Minha parte no cartão do meu pai</label><strong>${money(balances.owedMine)}</strong></div><div class="mini-stat mt-16"><label>Parte dele no meu cartão</label><strong>${money(balances.owedDad)}</strong></div><div class="notice mt-16">${balances.net>0?`Saldo líquido: você deve ${money(balances.net)} ao seu pai.`:balances.net<0?`Saldo líquido: seu pai deve ${money(-balances.net)} a você.`:'Não há saldo líquido pendente.'} Os acertos não criam novas despesas.</div><button class="button primary small mt-16" data-action="new-settlement">${icon('swap')} Registrar reembolso</button>`)}${panel('Histórico de reembolsos','Pagamentos registrados entre vocês',data.settlements.length?`<div class="statement-list">${[...data.settlements].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12).map(s=>`<div class="statement-row"><div><strong>${s.from==='mine'?'Você → Pai':'Pai → Você'}</strong><small>${displayDate(s.date)}${s.notes?' · '+esc(s.notes):''}</small></div><div class="flex-align"><strong>${money(s.amount)}</strong><button class="button ghost tiny" data-action="delete-settlement" data-id="${esc(s.id)}" aria-label="Excluir reembolso">${icon('trash',14)}</button></div></div>`).join('')}</div>`:empty('Nenhum reembolso registrado','Use o botão ao lado para lançar um acerto real.'))}</div><div class="notice mt-20"><strong>Como os valores são calculados?</strong>O consumo pertence ao mês da compra. Uma compra parcelada é dividida entre as faturas futuras. Marcar uma fatura como paga ou registrar um reembolso não adiciona uma nova despesa de consumo. O saldo entre vocês considera parcelas que vencem até o mês selecionado.</div>`}
function renderRecurring(){const pending=recurringPending(selectedMonth),active=data.recurring.filter(r=>r.active),monthlyEquivalent=sum(active,r=>r.frequency==='monthly'?r.amount:Math.round(r.amount/12));const freqLabel=x=>x==='yearly'?'Anual':'Mensal';return `<p class="intro">Planeje contas fixas e assinaturas, acompanhe seus vencimentos e gere cada lançamento apenas uma vez.</p><div class="kpis">${kpi('Recorrências ativas',String(active.length),'Contas e assinaturas cadastradas','repeat')}${kpi('Custo mensal médio',money(monthlyEquivalent),'Anuais rateadas por 12 para referência','wallet','orange')}${kpi('Pendentes neste mês',String(pending.length),'Ainda não viraram lançamentos reais','clock','pink')}${kpi('Previsão pendente',money(totalBy(pending)),'Não incluída nas despesas registradas','receipt','green')}</div><section class="panel mt-20"><div class="panel-head"><div><h2 class="panel-title">Contas recorrentes</h2><div class="panel-sub">Assinaturas, aluguel, internet, energia e outras despesas fixas</div></div><button class="button primary small" data-action="add-recurring">${icon('plus')} Nova recorrência</button></div>${data.recurring.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Despesa</th><th>Valor</th><th>Frequência</th><th>Vence dia</th><th>Cartão</th><th>Status</th><th class="text-right">Ações</th></tr></thead><tbody>${data.recurring.map(r=>`<tr><td><div class="transaction-name">${catIcon(r.category)}<div class="name-ellipsis"><strong>${esc(r.description)}</strong><small>${esc(getCat(r.category).name)}${r.subcategory?' · '+esc(r.subcategory):''}</small></div></div></td><td class="amount-main">${money(r.amount)}</td><td>${freqLabel(r.frequency)}</td><td>${r.day}</td><td>${r.card==='mine'?'Meu':'Pai'}</td><td><span class="pill ${r.active?'green':'red'}">${r.active?'Ativa':'Pausada'}</span></td><td><div class="tiny-actions"><button class="button ghost tiny" data-action="toggle-recurring" data-id="${esc(r.id)}" aria-label="Ativar ou pausar">${icon('refresh',15)}</button><button class="button ghost tiny" data-action="edit-recurring" data-id="${esc(r.id)}" aria-label="Editar">${icon('edit',15)}</button><button class="button ghost tiny" data-action="delete-recurring" data-id="${esc(r.id)}" aria-label="Excluir" style="color:var(--danger)">${icon('trash',15)}</button></div></td></tr>`).join('')}</tbody></table></div>`:empty('Nenhuma conta recorrente','Cadastre as contas para acompanhar vencimentos e criar previsões.')}<div class="notice mt-16"><strong>Lançamentos previstos não são despesas realizadas.</strong>Utilize a opção "Lançar" para registrar cada ocorrência. O sistema impede a geração duplicada da mesma recorrência no mesmo mês.</div></section>${panel('A lançar em '+formatMonth(selectedMonth),'Confirme valores variáveis antes de registrar a despesa',pending.length?`<div class="statement-list">${pending.map(r=>`<div class="statement-row"><div><strong>${esc(r.description)}</strong><small>Vencimento planejado: dia ${r.day} · ${r.card==='mine'?'Meu cartão':'Cartão do pai'}</small></div><div class="flex-align"><strong>${money(r.amount)}</strong><button class="button subtle small" data-action="post-recurring" data-id="${esc(r.id)}">Lançar</button></div></div>`).join('')}</div><button class="button primary small mt-16" data-action="post-all-recurring">${icon('plus')} Lançar todas as pendentes</button>`:empty('Tudo organizado','Não há recorrências pendentes neste mês.'),'')}`}
function renderBudgets(){const month=selectedMonth,inc=income(month),due=monthlyDue(month),target=data.savingsTarget||0,catsList=cats();const limits=Object.entries(data.budgets).filter(([,v])=>v>0);let spend=consumption(month);return `<p class="intro">Defina limites por categoria de acordo com sua responsabilidade financeira e acompanhe quanto da renda já está comprometido.</p><div class="kpis">${kpi('Renda do mês',money(inc),'Pode ser alterada com vigência','wallet')}${kpi('Faturas da sua parte',money(due.mine),'Vencimentos deste mês','receipt','orange')}${kpi('Reserva planejada',money(target),'Meta opcional; não é gasto de consumo','target','green')}${kpi('Após faturas e reserva',money(inc-due.mine-target),'Não inclui recorrências ainda não lançadas','trend','pink',inc-due.mine-target<0?'neg':'positive')}</div><div class="section-grid">${panel('Limites por categoria','O uso considera sua parte das compras feitas neste mês',catsList.map(c=>{const used=sum(spend,t=>t.category===c.id?t.mine:0),limit=data.budgets[c.id]||0,pct=roundPct(used,limit);return `<div class="budget-row"><div class="progress-header"><div class="flex-align">${catIcon(c.id)}<div><strong>${esc(c.name)}</strong><div class="tiny-text muted">${limit?`${pct}% do limite utilizado`:'Sem limite definido'}</div></div></div><div class="flex-align"><label class="tiny-text muted" for="budget_${c.id}">R$</label><input class="input limit-edit" type="number" step="0.01" min="0" id="budget_${c.id}" data-budget="${c.id}" value="${limit?num(limit):''}" placeholder="0,00"></div></div><div class="thin-progress"><span style="width:${limit?Math.min(100,pct):0}%;background:${limit&&pct>=100?'var(--danger)':limit&&pct>=80?'var(--warning)':c.color}"></span></div><div class="values"><span>Minha parte: ${money(used)}</span><span>${limit?`Limite: ${money(limit)}`:'Defina uma meta'}</span></div></div>`}).join('')+`<div class="overview-foot"><span class="tiny-text muted">Alerta visual a partir de 80% do limite.</span><button function dayGrid(month){const [y,mo]=month.split('-').map(Number),first=new Date(y,mo-1,1),start=(first.getDay()+6)%7,n=lastDay(month),total=totalBy(consumption(month)),today=localToday();const dayTotals={};const dayCounts={};consumption(month).forEach(t=>{const d=Number(t.date.slice(8));dayTotals[d]=(dayTotals[d]||0)+t.amount;dayCounts[d]=(dayCounts[d]||0)+1});let cells=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d=>`<div class="calendar-head">${d}</div>`).join('');for(let i=0;i<start;i++)cells+='<div class="calendar-day other"></div>';for(let d=1;d<=n;d++){const date=`${month}-${pad(d)}`;cells+=`<div class="calendar-day ${date===today?'today':''}"><span class="day-num">${d}</span>${dayTotals[d]?`<span class="day-money">${money(dayTotals[d])}</span><span class="day-count">${dayCounts[d]} compra(s)</span>`:''}</div>`}return `<div class="calendar">${cells}</div><div class="overview-foot"><small class="muted">Valores por data de compra</small><strong>${money(total)} no mês</strong></div>`}
function renderHabits(){const m=selectedMonth,t=consumption(m),markets=t.filter(x=>x.category==='mercado'),foods=t.filter(x=>x.category==='ifood'),merchants=new Map(),products=new Map(),weekday=[0,0,0,0,0,0,0];t.forEach(x=>{const merchant=(x.merchant||'Não informado').trim();const item=merchants.get(merchant)||{total:0,count:0};item.total+=x.amount;item.count++;merchants.set(merchant,item);const [y,mo,d]=x.date.split('-').map(Number);const day=(new Date(y,mo-1,d).getDay()+6)%7;weekday[day]+=x.amount;(x.items||[]).forEach(p=>{if(!p.label?.trim())return;const label=p.label.trim().toLocaleLowerCase('pt-BR');const old=products.get(label)||{total:0,qty:0};old.total+=Math.round((p.quantity||1)*(p.unit||0));old.qty+=Number(p.quantity)||0;products.set(label,old)})});const topMerchants=[...merchants].sort((a,b)=>b[1].total-a[1].total).slice(0,7),topProducts=[...products].sort((a,b)=>b[1].qty-a[1].qty).slice(0,7);return `<p class="intro">Entenda a frequência de compra, os estabelecimentos mais usados e os dias em que você mais consome.</p><div class="kpis">${kpi('Compras no mercado',String(markets.length),`Total ${money(totalBy(markets))}`,'basket')}${kpi('Pedidos de delivery',String(foods.length),`Total ${money(totalBy(foods))}`,'food','orange')}${kpi('Ticket médio',money(t.length?Math.round(totalBy(t)/t.length):0),'Média por lançamento','wallet','pink')}${kpi('Estabelecimentos',String(merchants.size),'Locais diferentes registrados','bag','green')}</div><div class="section-grid">${panel('Calendário de consumo','Visualize em quais dias houve despesas',dayGrid(m))}${panel('Onde você mais gasta','Ranking por total comprado',topMerchants.length?`<div class="ranking">${horizontalBar(topMerchants.map(([label,x],i)=>({index:i+1,label,sub:x.count+' compra(s)',value:x.total})),topMerchants[0][1].total)}</div>`:empty('Sem estabelecimentos','Inclua a loja ou restaurante ao registrar suas compras.'))}</div><div class="section-grid even">${panel('Gastos por dia da semana','Comparativo de segundas a domingos',`<div class="ranking">${horizontalBar(weekday.map((value,i)=>({index:'',label:['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'][i],value,color:'#6976ef'})),Math.max(1,...weekday))}</div>`)}${panel('Produtos mais frequentes','Itens detalhados das compras',topProducts.length?`<div class="statement-list">${topProducts.map(([name,p])=>`<div class="statement-row"><div><strong>${esc(name)}</strong><small>${p.qty.toLocaleString('pt-BR')} unidade(s) registradas</small></div><strong>${money(p.total)}</strong></div>`).join('')}</div>`:empty('Nenhum produto detalhado','No lançamento de uma compra, use a seção de itens individuais.'))}</div><div class="section-grid even">${panel('Consumo de energia e água','Quantidade registrada em contas dos últimos seis meses',utilityHistory(m))}${panel('Dicas de registro','Melhore os relatórios com pequenos detalhes',`<div class="tips"><div class="tip"><span class="tip-icon">${icon('basket',16)}</span><span class="tip-body"><strong>Descreva os produtos</strong>Use o detalhamento de itens nas compras de mercado para acompanhar frequência e valores por produto.</span></div><div class="tip"><span class="tip-icon">${icon('activity',16)}</span><span class="tip-body"><strong>Informe o consumo das faturas</strong>Nas contas de água e energia, registre m³ ou kWh para comparar meses.</span></div></div>`)}</div>`}

function renderReports(){const y=selectedMonth.slice(0,4),months=Array.from({length:12},(_,i)=>`${y}-${pad(i+1)}`),rows=months.map(m=>({month:m,...totals(m),due:monthlyDue(m)}));const yearly=sum(rows,r=>r.total),yearMine=sum(rows,r=>r.mine),highest=[...rows].sort((a,b)=>b.total-a.total)[0];return `<p class="intro">Compare meses, acompanhe a divisão financeira e exporte seus registros para análise ou backup.</p><div class="toolbar"><button class="button outline small" data-action="export-csv">${icon('download')} Exportar despesas CSV</button><button class="button outline small" data-action="export-json">${icon('download')} Backup completo JSON</button><button class="button outline small" data-action="print">${icon('receipt')} Salvar relatório em PDF</button></div><div class="kpis">${kpi('Consumo do ano',money(yearly),`Total de ${y}`,'receipt')}${kpi('Minha parte no ano',money(yearMine),'Responsabilidade por data de compra','wallet','pink')}${kpi('Parte do pai no ano',money(yearly-yearMine),'Responsabilidade por data de compra','card','green')}${kpi('Média mensal',money(Math.round(yearly/12)),'Total dividido por 12 meses','chart','orange')}</div><div class="section-grid">${panel('Evolução mensal · '+y,'Consumo total e minha parcela em cada mês',`<div class="chart-box" style="height:245px">${yearBars(rows)}</div>`)}${panel('Destaques anuais','Comparações do período selecionado',`<div class="month-tile"><span>Mês de maior consumo</span><strong>${highest.total?formatMonth(highest.month):'—'}</strong><small class="muted">${money(highest.total)}</small></div><div class="month-tile mt-16"><span>Minha participação no consumo</span><strong>${roundPct(yearMine,yearly)}%</strong></div><div class="month-tile mt-16"><span>Faturas que vencem no ano</span><strong>${money(sum(rows,r=>r.due.total))}</strong></div>`)}</div>${panel('Resumo de todos os meses','Consumo por data de compra e faturas por vencimento',`<div class="table-wrap"><table class="table"><thead><tr><th>Mês</th><th>Co function yearBars(rows){const max=Math.max(1,...rows.map(r=>r.total)),labels=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];const w=710,h=250,left=35,right=8,top=12,bottom=215,plotH=bottom-top,groupW=(w-left-right)/12;let svg='';for(let i=0;i<5;i++){const y=bottom-(i/4)*plotH;svg+=`<line x1="${left}" y1="${y}" x2="${w-right}" y2="${y}" stroke="var(--border)" stroke-dasharray="4 4"/><text x="4" y="${y+3}" class="chart-label">${Math.round(max*i/400)}</text>`}rows.forEach((r,i)=>{let x=left+i*groupW+groupW*.17,barW=groupW*.28,h1=r.total/max*plotH,h2=r.mine/max*plotH;svg+=`<rect x="${x}" y="${bottom-h1}" width="${barW}" height="${h1}" rx="3" fill="#6974ed"><title>${labels[i]}: consumo ${money(r.total)}</title></rect><rect x="${x+barW+2}" y="${bottom-h2}" width="${barW}" height="${h2}" rx="3" fill="#45c2ad"><title>${labels[i]}: minha parte ${money(r.mine)}</title></rect><text x="${left+i*groupW+groupW*.5}" y="236" text-anchor="middle" class="chart-label">${labels[i]}</text>`});return `<svg viewBox="0 0 710 245" preserveAspectRatio="none" width="100%" height="100%" role="img" aria-label="Barras mensais">${svg}</svg><div class="flex-align tiny-text muted" style="justify-content:center;gap:17px;margin-top:-5px"><span><span class="dot" style="background:#6974ed"></span> Consumo total</span><span><span class="dot" style="background:#45c2ad"></span> Minha parte</span></div>`}

function recurringModal(r){const cat=r?.category||'contas',owner=r?(r.mine===r.amount?'mine':r.mine===0?'dad':'split'):'';const content=`<div class="form-grid">${field('Nome da conta / assinatura *',`<input class="input" name="description" maxlength="120" value="${esc(r?.description||'')}" placeholder="Ex.: Internet residencial" required>`)}${field('Valor previsto (R$) *',`<input class="input" name="amount" type="number" min="0.01" step="0.01" value="${r?num(r.amount):''}" required>`)}${field('Categoria',`<select class="select" id="recCat" name="category">${catOptions(cat)}</select>`)}${field('Subcategoria',`<select class="select" name="subcategory" id="recSubcat">${subOptions(cat,r?.subcategory||'')}</select>`)}${field('Periodicidade',`<select class="select" name="frequency"><option value="monthly" ${r?.frequency!=='yearly'?'selected':''}>Mensal</option><option value="yearly" ${r?.frequency==='yearly'?'selected':''}>Anual</option></select>`)}${field('Dia da cobrança',`<input class="input" name="day" type="number" min="1" max="28" value="${r?.day||10}" required>`)}${field('Vigência inicial',`<input class="input" name="start" type="month" value="${r?.start||selectedMonth}" required>`)}${field('Cartão sugerido',`<select class="select" name="card" id="recCard" required>${cardOptions(r?.card||favoriteCard(cat,r?.subcategory)||'')}</select>`)}<div class="field span-2"><label>Responsabilidade *</label><div class="radio-pills"><label class="radio-pill"><input type="radio" name="owner" value="mine" ${owner==='mine'?'checked':''}><span>Minha</span></label><label class="radio-pill"><input type="radio" name="owner" value="dad" ${owner==='dad'?'checked':''}><span>Do pai</span></label><label class="radio-pill"><input type="radio" name="owner" value="split" ${owner==='split'?'checked':''}><span>Dividida</span></label></div></div><div class="field span-2" id="recSplitField" style="display:${owner==='split'?'grid':'none'}"><label>Minha parcela (R$)</label><input class="input" name="mine" type="number" min="0" step="0.01" value="${r?num(r.mine):''}"></div></div>`;return modalLayout(r?'Editar recorrência':'Nova conta recorrente','A recorrência gera previsões; cada ocorrência precisa ser lançada no mês.',content,r?'Salvar alterações':'Cadastrar recorrência','recurringForm')}

function openModal(type,id=null){modalType=type;editingId=id;let markup='';if(type==='expense')markup=expenseModal(id?data.transactions.find(t=>t.id===id):null);if(type==='recurring')markup=recurringModal(id?data.recurring.find(r=>r.id===id):null);if(type==='settlement')markup=settlementModal();if(type==='income')markup=incomeModal();if(type==='category')markup=categoryModal();document.getElementById('modalRoot').innerHTML=markup;document.body.style.overflow='hidden';const first=document.querySelector('#modalRoot input:not([type="radio"]),#modalRoot select');if(first)setTimeout(()=>first.focus(),50)}
function closeModal(){modalType=null;editingId=null;currentReceipt='';document.getElementById('modalRoot').innerHTML='';document.body.style.overflow=''}
function readItems(){return [...document.querySelectorAll('#itemRows .line-item')].map(row=>({label:row.querySelector('[name=item_label]').value.trim(),quantity:Number(row.querySelector('[name=item_qty]').value),unit:toCents(row.querySelector('[name=item_unit]').value)})).filter(x=>x.label||x.unit>0).filter(x=>x.quantity>0&&Number.isFinite(x.unit)&&x.unit>=0)}
function computeMine(form,amount){const who=form.querySelector('[name="owner"]:checked')?.value;if(!who)throw Error('Selecione quem será responsável pelo pagamento.');if(who==='mine')return amount;if(who==='dad')return 0;const mine=toCents(form.querySelector('[name="mine"]').value);if(!Number.isFinite(mine)||mine<0||mine>amount)throw Error('Informe sua parcela entre R$ 0 e o valor total.');return mine}
function submitExpense(form){const fd=new FormData(form),amount=toCents(fd.get('amount')),n=Number(fd.get('installments')),card=fd.get('card'),desc=String(fd.get('description')||'').trim(),date=String(fd.get('date')||''),cat=fd.get('category');if(!desc||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(amount)||amount<=0)throw Error('Preencha descrição, data e valor válido.');if(!['mine','dad'].includes(card))throw Error('Selecione o cartão utilizado.');if(!Number.isInteger(n)||n<1||n>120)throw Error('Informe entre 1 e 120 parcelas.');const mine=computeMine(form,amount),items=readItems();const usageRaw=String(fd.get('usage')||'').trim(),usageValue=cat==='contas'&&usageRaw!==''?Number(usageRaw):null;if(usageValue!==null&&(!Number.isFinite(usageValue)||usageValue<0))throw Error('Consumo da fatura inválido.');const tx={id:editingId||makeId(),createdAt:new Date().toISOString(),date,amount,mine,description:desc,merchant:String(fd.get('merchant')||'').trim(),category:cat,subcategory:String(fd.get('subcategory')||''),card,installments:n,notes:String(fd.get('notes')||''),items,receipt:currentReceipt,usageValue,usageUnit:String(fd.get('usageUnit')||'kWh')};if(editingId){const i=data.transactions.findIndex(x=>x.id===editingId);if(i<0)throw Error('Despesa não encontrada.');const prev=data.transactions[i];invalidateBillStatus(prev);tx.createdAt=prev.createdAt;tx.recurringId=prev.recurringId;tx.recurringMonth=prev.recurringMonth;data.transactions[i]=tx}else{data.transactions.push(tx)}invalidateBillStatus(tx);const wasEditing=!!editingId;save();closeModal();render();notify(wasEditing?'Despesa atualizada.':'Despesa registrada com sucesso.')}
function submitRecurring(form){const fd=new FormData(form),amount=toCents(fd.get('amount')),description=String(fd.get('description')||'').trim(),card=String(fd.get('card')),day=Number(fd.get('day')),start=String(fd.get('start')),category=String(fd.get('category'));if(!description||!Number.isFinite(amount)||amount<=0||day<1||day>28||!['mine','dad'].includes(card)||!/^\d{4}-\d{2}$/.test(start))throw Error('Preencha corretamente os dados da recorrência.');const mine=computeMine(form,amount);const prev=editingId?data.recurring.find(x=>x.id===editingId):null;const r={id:editingId||makeId(),description,amount,mine,day,start,card,category,subcategory:String(fd.get('subcategory')||''),frequency:fd.get('frequency'),active:prev?prev.active:true};if(prev){data.recurring[data.recurring.findIndex(x=>x.id===editingId)]=r}else data.recurring.push(r);save();closeModal();render();notify('Recorrência salva.')}
function submitSettlement(form){const f=new FormData(form),amount=toCents(f.get('amount'));if(!Number.isFinite(amount)||amount<=0)throw Error('Valor de reembolso inválido.');data.settlements.push({id:makeId(),date:String(f.get('date')),amount,from:String(f.get('from')),notes:String(f.get('notes')||'')});save();closeModal();render();notify('Reembolso registrado sem duplicar despesas.')}
function submitIncome(form){const f=new FormData(form),amount=toCents(f.get('amount')),from=String(f.get('from'));if(!Number.isFinite(amount)||amount<0||!/^\d{4}-\d{2}$/.test(from))throw Error('Informe uma renda e uma vigência válidas.');data.salary=data.salary.filter(x=>x.from!==from);data.salary.push({from,amount});data.salary.sort((a,b)=>a.from.localeCompare(b.from));save();closeModal();render();notify('Histórico de renda atualizado.')}
function submitCategory(form){const f=new FormData(form),name=String(f.get('name')||'').trim(),color=String(f.get('color')||'#6378ee');if(!name)throw Error('Insira o nome da categoria.');if(cats().some(c=>c.name.toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR')))throw Error('Essa categoria já existe.');const subs=String(f.get('subs')||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,40);data.customCategories.push({id:`custom_${makeId()}`,name,icon:'layers',color:/^#[0-9A-Fa-f]{6}$/.test(color)?color:'#6378ee',subs:subs.length?subs:['Outros']});save();closeModal();render();notify('Categoria adicionada.')}
function submitModal(form){try{if(form.id==='expenseForm')submitExpense(form);if(form.id==='recurringForm')submitRecurring(form);if(form.id==='settlementForm')submitSettlement(form);if(form.id==='incomeForm')submitIncome(form);if(form.id==='categoryForm')submitCategory(form)}catch(e){notify(e.message||'Verifique os campos do formulário.',true)}}
function postRecurring(r){if(!r||!recurringIsDue(r,selectedMonth))return false;if(data.transactions.some(t=>t.recurringId===r.id&&t.recurringMonth===selectedMonth))return false;const tx={id:makeId(),createdAt:new Date().toISOString(),date:clampDate(selectedMonth,r.day),description:r.description,merchant:'',category:r.category,subcategory:r.subcategory||'',amount:r.amount,mine:r.mine,card:r.card,installments:1,notes:`Gerado a partir de recorrência ${r.frequency==='yearly'?'anual':'mensal'}. Confirme o valor real.`,items:[],receipt:'',recurringId:r.id,recurringMonth:selectedMonth};data.transactions.push(tx);invalidateBillStatus(tx);return true}
function csvCell(x){const s=String(x??'');return /[",\r\n;]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}
function downloadFile(contents,name,type){const blob=new Blob([contents],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function exportCSV(){const hdr=['id','date','description','amount','category','subcategory','merchant','card','mineShare','installments','notes','items','usageValue','usageUnit','recurringId','recurringMonth'];const lines=[hdr.join(';'),...data.transactions.map(t=>hdr.map(k=>csvCell(k==='amount'?num(t.amount):k==='mineShare'?num(t.mine):k==='items'?JSON.stringify(t.items||[]):t[k]??'')).join(';'))];downloadFile('\ufeff'+lines.join('\r\n'),`nexo_despesas_${selectedMonth}.csv`,'text/csv;charset=utf-8');notify('Arquivo CSV preparado.')}
function exportJSON(){downloadFile(JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2),`nexo_backup_${localToday()}.json`,'application/json');notify('Backup completo preparado.')}
function parseCSV(text){text=text.replace(/^\ufeff/,'');const first=text.split(/\r?\n/,1)[0]||'';const delim=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';let rows=[],current=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else{if(c==='"')quoted=true;else if(c===delim){current.push(cell);cell=''}else if(c==='\r'&&text[i+1]==='\n'){current.push(cell);rows.push(current);current=[];cell='';i++}else if(c==='\n'||c==='\r'){current.push(cell);rows.push(current);current=[];cell=''}else cell+=c}}if(cell.length||current.length){current.push(cell);rows.push(current)}return rows.filter(row=>row.some(c=>c.trim()))}
function canonicalDate(s){s=String(s||'').trim();if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)){const [d,m,y]=s.split('/');return `${y}-${m}-${d}`}return s}
async function importCSV(file){if(!file)return;const content=await file.text(),rows=parseCSV(content),headers=(rows.shift()||[]).map(x=>x.trim());if(!['date','description','amount'].every(x=>headers.includes(x)))throw Error('CSV precisa ter as colunas date, description e amount.');const get=(row,key)=>row[headers.indexOf(key)]??'';let count=0,skipped=0;const sig=t=>`${t.date}|${t.description.toLowerCase()}|${t.amount}|${t.card}`;const seen=new Set(data.transactions.map(sig));for(const row of rows){const date=canonicalDate(get(row,'date')),amount=toCents(get(row,'amount')),desc=get(row,'description').trim(),card=['mine','dad'].includes(get(row,'card'))?get(row,'card'):'mine';const mineInput=get(row,'mineShare');const mine=mineInput!==''?toCents(mineInput):amount;const n=Number(get(row,'installments')||1);if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(amount)||amount<=0||!desc||!Number.isFinite(mine)||mine<0||mine>amount||!Number.isInteger(n)||n<1||n>120){skipped++;continue}const originalCat=get(row,'category');let cat=cats().find(x=>x.id===originalCat||x.name.toLowerCase()===originalCat.toLowerCase())?.id||'outros';let items=[];try{const obj=JSON.parse(get(row,'items')||'[]');if(Array.isArray(obj))items=obj.filter(x=>typeof x.label==='string').map(x=>({label:x.label.slice(0,100),quantity:Number(x.quantity)||1,unit:Number(x.unit)||0})).slice(0,200)}catch(e){}const tx={id:makeId(),createdAt:new Date().toISOString(),date,amount,mine,description:desc,merchant:get(row,'merchant'),category:cat,subcategory:get(row,'subcategory'),card,installments:n,notes:get(row,'notes'),items,receipt:'',usageValue:get(row,'usageValue')!==''?Number(get(row,'usageValue')):null,usageUnit:get(row,'usageUnit')||'kWh',recurringId:get(row,'recurringId'),recurringMonth:get(row,'recurringMonth')};if(seen.has(sig(tx))){skipped++;continue}data.transactions.push(tx);seen.add(sig(tx));count++}save();render();notify(`${count} despesas importadas; ${skipped} ignoradas.`)}
async function importJSON(file){if(!file)return;if(file.size>20*1024*1024)throw Error('Backup acima de 20 MB.');const obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.transactions)||!Array.isArray(obj.cards)||!Array.isArray(obj.salary))throw Error('Este arquivo não parece ser um backup Nexo válido.');const valid=obj.transactions.every(t=>typeof t.id==='string'&&typeof t.date==='string'&&Number.isInteger(t.amount)&&t.amount>0&&Number.isInteger(t.mine)&&t.mine>=0&&t.mine<=t.amount&&['mine','dad'].includes(t.card));if(!valid)throw Error('Existem lançamentos inválidos neste backup.');if(!confirm(`Restaurar ${obj.transactions.length} despesas? Isto substitui todos os dados locais atuais. Faça um backup antes de continuar.`))return;localStorage.setItem(STORAGE_KEY,JSON.stringify(obj));data=loadData();closeModal();render();notify('Backup restaurado.')}
async function compressImage(file){if(!file.type.startsWith('image/'))throw Error('Selecione um arquivo de imagem.');if(file.size>12*1024*1024)throw Error('Imagem muito grande (limite de 12 MB).');const src=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(file)});const image=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src});const scale=Math.min(1,900/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);const out=canvas.toDataURL('image/jpeg',.68);if(out.length>800000)throw Error('Imagem compactada ainda muito grande. Use um comprovante menor.');return out}
function updateReceiptPreview(){const el=document.getElementById('receiptPreview');if(el)el.innerHTML=currentReceipt?`<div class="flex-align mt-16"><a href="${currentReceipt}" target="_blank" rel="noopener" class="tiny-text">Visualizar comprovante salvo</a><button type="button" class="button ghost tiny" data-modal-action="remove-receipt">${icon('trash')} Remover</button></div>`:''}
function handleAction(action,el){const id=el.dataset.id;switch(action){case'add':openModal('expense');break;case'edit-expense':openModal('expense',id);break;case'delete-expense':if(confirm('Excluir esta despesa? O lançamento e todas as suas parcelas serão removidos.')){invalidateBillStatus(data.transactions.find(t=>t.id===id));data.transactions=data.transactions.filter(t=>t.id!==id);save();render();notify('Despesa excluída.')}break;case'toggle-paid':{const k=`${el.dataset.card}:${selectedMonth}`;data.billPaid[k]=!data.billPaid[k];save();render();notify(data.billPaid[k]?'Fatura marcada como paga.':'Fatura marcada como pendente.');break}case'new-settlement':openModal('settlement');break;case'delete-settlement':if(confirm('Remover este reembolso?')){data.settlements=data.settlements.filter(x=>x.id!==id);save();render();notify('Reembolso removido.')}break;case'add-recurring':openModal('recurring');break;case'edit-recurring':openModal('recurring',id);break;case'delete-recurring':if(confirm('Excluir esta regra de recorrência? As despesas já lançadas serão mantidas.')){data.recurring=data.recurring.filter(x=>x.id!==id);save();render();notify('Regra removida.')}break;case'toggle-recurring':{const r=data.recurring.find(x=>x.id===id);if(r){r.active=!r.active;save();render();notify(r.active?'Recorrência ativada.':'Recorrência pausada.')}break}case'post-recurring':{const r=data.recurring.find(x=>x.id===id);if(postRecurring(r)){save();render();notify('Conta lançada. Confira o valor na lista de gastos.')}else notify('Essa conta já foi lançada ou não vence neste mês.',true);break}case'post-all-recurring':{let count=0;for(const r of recurringPending(selectedMonth))if(postRecurring(r))count++;save();render();notify(`${count} recorrência(s) lançada(s).`);break}case'save-budgets':{for(const inp of document.querySelectorAll('[data-budget]')){const v=toCents(inp.value);if(!Number.isFinite(v)||v<0){notify('Verifique os limites informados.',true);return}data.budgets[inp.dataset.budget]=v}save();render();notify('Limites salvos.');break}case'save-saving':{const v=toCents(document.getElementById('savingTarget').value);if(!Number.isFinite(v)||v<0){notify('Meta inválida.',true);return}data.savingsTarget=v;save();render();notify('Planejamento salvo.');break}case'add-income':openModal('income');break;case'delete-income':if(data.salary.length>1&&confirm('Excluir esta alteração de renda?')){data.salary=data.salary.filter(s=>s.from!==el.dataset.month);save();render();notify('Histórico atualizado.')}break;case'new-category':openModal('category');break;case'delete-category':{const use=data.transactions.some(t=>t.category===id)||data.recurring.some(r=>r.category===id);if(use){notify('Esta categoria está sendo usada. Reclassifique os gastos antes de excluir.',true);break}if(confirm('Excluir categoria personalizada?')){data.customCategories=data.customCategories.filter(c=>c.id!==id);delete data.budgets[id];save();render();notify('Categoria excluída.')}break}case'toggle-theme':data.theme=data.theme==='dark'?'light':'dark';save();render();break;case'export-csv':exportCSV();break;case'export-json':exportJSON();break;case'import-click':{let file=document.getElementById('csvFile');if(!file){go('settings');file=document.getElementById('csvFile')}file?.click();break}case'import-json-click':document.getElementById('jsonFile')?.click();break;case'print':window.print();break;case'reset-all':if(confirm('ATENÇÃO: todos os gastos, cartões, rendas e configurações serão apagados. Faça um backup antes. Continuar?')&&confirm('Confirmar exclusão definitiva de todos os dados deste navegador?')){data=defaultData();save();go('overview');notify('Dados locais reiniciados.')}break}}
// Eventos de navegação e interação
const content=document.getElementById('content');
document.getElementById('brandMark').innerHTML=icon('activity',21);
document.getElementById('sideHintIcon').innerHTML=icon('trend',19);
document.getElementById('prevMonth').innerHTML=icon('chevLeft',16);
document.getElementById('nextMonth').innerHTML=icon('chevRight',16);
document.getElementById('quickAdd').innerHTML=icon('plus',16)+' Novo gasto';
document.getElementById('mobileMenu').innerHTML=icon('menu',18);
document.getElementById('prevMonth').addEventListener('click',()=>{selectedMonth=monthShift(selectedMonth,-1);render()});
document.getElementById('nextMonth').addEventListener('click',()=>{selectedMonth=monthShift(selectedMonth,1);render()});
document.getElementById('quickAdd').addEventListener('click',()=>openModal('expense'));
document.getElementById('themeButton').addEventListener('click',()=>{data.theme=data.theme==='dark'?'light':'dark';save();render()});
document.getElementById('mobileMenu').addEventListener('click',()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('mobileOverlay').classList.add('visible')});
document.getElementById('mobileOverlay').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').classList.remove('visible')});
document.addEventListener('click',ev=>{const nav=ev.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return}const action=ev.target.closest('[data-action]');if(action){handleAction(action.dataset.action,action);return}const modalAction=ev.target.closest('[data-modal-action]');if(modalAction){const a=modalAction.dataset.modalAction;if(a==='close'){closeModal();return}if(a==='add-item'){document.getElementById('itemRows')?.insertAdjacentHTML('beforeend',lineItemRow());return}if(a==='remove-item'){modalAction.closest('.line-item')?.remove();return}if(a==='apply-items'){const items=readItems();if(!items.length){notify('Adicione itens com quantidade e preço.',true);return}const amount=sum(items,x=>Math.round(x.quantity*x.unit));document.getElementById('expAmount').value=num(amount);document.getElementById('itemsSum').textContent=`Itens: ${money(amount)}`;notify('Soma dos itens aplicada ao valor total.');return}if(a==='remove-receipt'){currentReceipt='';document.getElementById('expReceipt').value='';updateReceiptPreview();return}}if(ev.target.id==='backdrop')closeModal()});
document.addEventListener('change',async ev=>{const t=ev.target;if(t.id==='filterCategory'){transFilters.category=t.value;render()}if(t.id==='filterCard'){transFilters.card=t.value;render()}if(t.id==='filterOwner'){transFilters.responsibility=t.value;render()}if(t.id==='expCategory'||t.id==='recCat'){const prefix=t.id==='expCategory'?'exp':'rec',sub=document.getElementById(prefix==='exp'?'expSubcat':'recSubcat');if(sub)sub.innerHTML=subOptions(t.value);if(prefix==='exp'&&!cardChosenManually){const card=document.getElementById('expCard');if(card)card.value=''}if(prefix==='exp'){const usage=document.getElementById('usageField');if(usage)usage.style.display=t.value==='contas'?'grid':'none';updateCardHint()}if(prefix==='rec'){const card=document.getElementById('recCard');if(card)card.value=''}}if(t.id==='expSubcat'&&!cardChosenManually){const card=document.getElementById('expCard');if(card)card.value=favoriteCard(document.getElementById('expCategory').value,t.value)||''}if(['expSubcat','expDate','expCard'].includes(t.id))updateCardHint();if(t.id==='recSubcat'){const card=document.getElementById('recCard');if(card)card.value=favoriteCard(document.getElementById('recCat').value,t.value)||''}if(t.id==='expCard')cardChosenManually=!!t.value;if(t.name==='owner'){const modal=document.getElementById('modalRoot');const split=modal.querySelector('#splitField, #recSplitField');if(split)split.style.display=modal.querySelector('[name="owner"]:checked')?.value==='split'?'grid':'none'}if(t.id==='expReceipt'&&t.files?.[0])try{currentReceipt=await compressImage(t.files[0]);updateReceiptPreview();notify('Comprovante anexado.')}catch(e){notify(e.message,true)}if(t.id==='csvFile'&&t.files?.[0])try{await importCSV(t.files[0]);t.value=''}catch(e){notify(e.message,true)}if(t.id==='jsonFile'&&t.files?.[0])try{await importJSON(t.files[0]);t.value=''}catch(e){notify(e.message,true)}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='searchExpenses'){const start=t.selectionStart,end=t.selectionEnd;transFilters.search=t.value;render();const search=document.getElementById('searchExpenses');if(search){search.focus();search.setSelectionRange(start,end)}}if(t.id==='expAmount')updateCardHint();if(t.id==='expAmount'&&document.getElementById('splitHint')){const v=toCents(t.value),mine=toCents(document.getElementById('expMine')?.value||'');document.getElementById('splitHint').textContent=`Do total ${money(v)}, ${money(Math.max(0,v-mine))} será responsabilidade do seu pai.`}});
document.addEventListener('submit',ev=>{const form=ev.target;if(form.id==='cardsForm'){ev.preventDefault();for(const c of data.cards){const close=Number(form.elements[`closing_${c.id}`].value),due=Number(form.elements[`due_${c.id}`].value);if(!Number.isInteger(close)||close<1||close>28||!Number.isInteger(due)||due<1||due>28){notify('Os dias precisam estar entre 1 e 28.',true);return}c.closing=close;c.due=due}data.billPaid={};save();render();notify('Datas dos cartões atualizadas. As parcelas foram recalculadas e as confirmações de pagamento foram zeradas.');return}if(['expenseForm','recurringForm','settlementForm','incomeForm','categoryForm'].includes(form.id)){ev.preventDefault();submitModal(form)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&modalType)closeModal()});
render();
