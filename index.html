:root{--on-primary:#fff;--warn-bg:#fff3e6;--warn-fg:#b0702a;--danger-bg:#ffedf0;--bar-soft:#cdd1fb;--m-credit:#5a6af2;--m-pix:#0f9d88;--m-debit:#d98324;--ease:cubic-bezier(.2,.75,.25,1)}
body.dark{--on-primary:#141b33;--warn-bg:#3a2e1f;--warn-fg:#f6b56c;--danger-bg:#3d2230;--bar-soft:#39407c}
html{-webkit-text-size-adjust:100%}
body{-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s}
@media(min-width:921px){body{background:radial-gradient(1100px 480px at 88% -12%,color-mix(in srgb,var(--primary) 9%,transparent),transparent 62%),var(--bg);background-attachment:fixed}}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 45%,transparent) transparent}
::selection{background:color-mix(in srgb,var(--primary) 28%,transparent)}
.panel,.kpi,.input,.select,.textarea,.month-switch,.icon-btn,.mini-stat,.month-tile,.tip,.calendar-day{transition:background-color .3s,border-color .3s,box-shadow .2s}
.kpi-value,.amount-main,.table td,.card-total,.mini-stat strong,.month-tile strong,.rank-amount,.statement-row strong,.mk-total,.split-legend strong{font-variant-numeric:tabular-nums}
.kpi-icon.orange{background:var(--warn-bg);color:var(--warn-fg)}.kpi-icon.pink{background:var(--danger-bg);color:var(--danger)}
.pill.red{background:var(--danger-bg)}.pill.orange{background:var(--warn-bg);color:var(--warn-fg)}.pill svg{flex:none}
.button.danger{background:var(--danger-bg);color:var(--danger)}
.notice.warning{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn-fg) 30%,transparent);color:var(--warn-fg)}
.sidebar{background:linear-gradient(180deg,#18274a 0%,#111b33 100%)}body.dark .sidebar{background:linear-gradient(180deg,#0e1830,#0a1122)}
.nav-btn{transition:background .18s,color .18s,transform .12s}.nav-btn:active{transform:scale(.98)}
.nav-btn.active{background:linear-gradient(90deg,#7883ff3d,#7883ff14)}
.button{transition:transform .12s var(--ease),background .18s,box-shadow .18s,color .18s,border-color .18s}
.button.primary{background:linear-gradient(135deg,#5459e8,#7468ee)}.button.primary:hover{background:linear-gradient(135deg,#474cd4,#665ae0);box-shadow:0 8px 20px #5459e840}
.button.outline:hover{border-color:var(--primary);color:var(--primary)}
.icon-btn{transition:color .18s,border-color .18s,transform .12s}.icon-btn:active{transform:scale(.94)}
.topbar{position:sticky;top:0;z-index:30;padding-bottom:12px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3)}
.content{padding-top:14px}
.table tbody tr{transition:background .15s}
.radio-pill span{transition:background .16s,border-color .16s,color .16s}.radio-pill span svg{vertical-align:-2px;margin-right:3px}
.toast{transition:opacity .22s,transform .28s var(--ease)}

/* Entrada ao trocar de tela ou de mês (uma sequência só; nada se repete ao digitar ou marcar) */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes wipe{from{clip-path:inset(-20px 100% -20px -20px)}to{clip-path:inset(-20px)}}
@keyframes spinIn{from{opacity:0;transform:rotate(-70deg) scale(.92)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.975)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes tick{0%{transform:scale(.7)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.content.enter>*{animation:rise .42s var(--ease) backwards}
.content.enter>*:nth-child(2){animation-delay:.04s}.content.enter>*:nth-child(3){animation-delay:.08s}.content.enter>*:nth-child(4){animation-delay:.12s}.content.enter>*:nth-child(n+5){animation-delay:.16s}
.content.enter>.kpis{animation:none}
.content.enter .kpi{animation:rise .42s var(--ease) backwards}.content.enter .kpi:nth-child(2){animation-delay:.05s}.content.enter .kpi:nth-child(3){animation-delay:.1s}.content.enter .kpi:nth-child(4){animation-delay:.15s}
.content.enter .thin-progress>span,.content.enter .split-track>span,.content.enter .method-track>span{transform-origin:left;animation:growX .7s .15s var(--ease) backwards}
.content.enter .bar{transform-box:fill-box;transform-origin:50% 100%;animation:growY .6s .12s var(--ease) backwards}
.content.enter .chart-box>svg[aria-label^="Evolução diária"]{animation:wipe .9s .1s var(--ease) backwards}
.content.enter .donut svg{animation:spinIn .7s var(--ease) backwards}
.modal-backdrop{animation:fadeIn .18s ease backwards}.modal{animation:pop .28s var(--ease) backwards}

/* Formas de pagamento */
.method-track{display:flex;gap:2px;height:12px;border-radius:999px;overflow:hidden;margin:8px 0 10px}
.method-track>span{display:block;min-width:5px}
.method-legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--muted)}.method-legend b{color:var(--text);font-weight:720;margin-left:5px}
.float-tip{position:fixed;z-index:210;pointer-events:none;background:#15223c;color:#fff;font-size:11.5px;font-weight:600;padding:7px 10px;border-radius:9px;box-shadow:0 8px 24px #0004;white-space:nowrap}
.chart-label.strong{fill:var(--text);font-weight:720}
.spark{width:64px;height:22px;flex:none}

/* Mercado */
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:4px;gap:3px;box-shadow:var(--shadow);max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:9px 14px;border-radius:10px;font-weight:700;color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .18s,color .18s}
.seg button:hover{color:var(--text)}.seg button.active{background:var(--primary-light);color:var(--primary)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--muted);transition:background .16s,color .16s,border-color .16s}
.chip b{font-weight:800;margin-left:3px}.chip.active{background:var(--primary-light);border-color:transparent;color:var(--primary)}
.mk-section{margin-top:18px}
.mk-section-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:760;color:var(--text);padding:0 4px 9px}
.mk-section-head span{font-weight:600;color:var(--muted);font-size:11px}
.mk-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;grid-template-areas:"check name qty price total";gap:12px;align-items:center;padding:9px 12px;border:1px solid var(--border);border-radius:14px;background:var(--surface);margin-bottom:8px;transition:background .18s,border-color .18s}
.mk-row.checked{background:var(--primary-light);border-color:color-mix(in srgb,var(--primary) 38%,var(--border))}
.mk-check{grid-area:check;width:27px;height:27px;border-radius:9px;border:2px solid color-mix(in srgb,var(--muted) 45%,var(--border));background:var(--surface);display:grid;place-items:center;color:transparent;padding:0;transition:background .16s,border-color .16s}
.mk-row.checked .mk-check{background:var(--primary);border-color:var(--primary);color:var(--on-primary);animation:tick .28s var(--ease)}
.mk-name{grid-area:name;border:0;background:none;text-align:left;color:inherit;padding:3px 0;min-width:0;display:grid;gap:3px}
.mk-name strong{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.mk-name small{font-size:11px;color:var(--muted)}
.mk-controls{display:contents}
.stepper{grid-area:qty;display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:10px;padding:3px}
.mk-row.checked .stepper{background:color-mix(in srgb,var(--surface) 55%,transparent)}
.stepper:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 25%,transparent)}
.stepper button{width:28px;height:28px;border:0;border-radius:8px;background:var(--surface);color:var(--text);display:grid;place-items:center;box-shadow:0 1px 2px #0001;transition:transform .1s}
.stepper button:active{transform:scale(.88)}
.stepper input{width:44px;border:0;background:none;text-align:center;font-weight:700;color:var(--text);padding:0;outline:none;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button,.mk-price::-webkit-outer-spin-button,.mk-price::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mk-measure{font-size:11px;color:var(--muted);padding:0 7px 0 2px;min-width:26px}
.mk-price-wrap{grid-area:price;display:flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:10px;padding:0 9px;height:34px;background:var(--surface);font-size:12px;color:var(--muted)}
.mk-price-wrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
.mk-price{width:60px;border:0;background:none;color:var(--text);font-weight:650;outline:none;padding:0;text-align:right;-moz-appearance:textfield;appearance:textfield}
.mk-total{grid-area:total;font-size:13px;text-align:right;min-width:86px}
.mk-summary{position:sticky;bottom:14px;z-index:5;margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px 12px 18px;border-radius:16px;background:#15223c;color:#fff;box-shadow:0 14px 34px rgba(10,19,35,.3)}
body.dark .mk-summary{background:#0b1324;border:1px solid var(--border)}
.mk-summary strong{display:block;font-size:13px}.mk-summary small{display:block;font-size:11.5px;color:#b3c0d8;margin-top:3px;font-variant-numeric:tabular-nums}
.mk-summary .button.ghost{color:#b3c0d8}.mk-summary .button.ghost:hover{color:#fff}
.mk-picked{max-height:210px;overflow-y:auto;margin-top:8px}

/* Navegação inferior no celular */
.bottom-nav{display:none}
@media(max-width:920px){
.bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:35;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bottom-nav button{border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:3px;padding:7px 2px;border-radius:12px;font-size:10.5px;font-weight:700;transition:color .18s,background .18s,transform .12s}
.bottom-nav button:active{transform:scale(.94)}.bottom-nav button.active{color:var(--primary);background:var(--primary-light)}
.content{padding-bottom:96px}.mobile-menu{display:none}
.topbar{position:static;background:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.toast{left:13px;right:13px;bottom:84px;max-width:none}
.mk-summary{bottom:80px}
}
@media(max-width:600px){
.modal-backdrop{align-items:flex-end;padding:0}
.modal,.modal.wide{width:100%;max-height:94vh;border-radius:22px 22px 0 0;animation:sheet .32s var(--ease) backwards}
.mk-row{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"check name total" "check ctl ctl";gap:8px 11px;padding:11px 12px}
.mk-controls{grid-area:ctl;display:flex;align-items:center;gap:8px}
.mk-total{min-width:0}
.mk-summary{padding:11px 12px 11px 14px}
.radio-pill span{padding:12px 4px}
.seg{display:flex}.seg button{flex:1;justify-content:center;padding:9px 6px}.seg button svg{display:none}
.heading-eyebrow{display:none}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important;scroll-behavior:auto!important}}
@media print{.bottom-nav,.mk-summary,.float-tip,.seg,.chips{display:none!important}}
.month-tile small{display:block;margin-top:5px}.content>.panel+.panel{margin-top:18px}
</style>

function icon(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.dots}</svg>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(cents){return (Number(cents||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function num(cents){return (Number(cents||0)/100).toFixed(2)}
function toCents(v){if(typeof v==='number')return Math.round(v*100);let s=String(v??'').trim().replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');let x=Number(s);return Number.isFinite(x)?Math.round(x*100):NaN}
function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function monthOf(d){return String(d||'').slice(0,7)}
function monthShift(m,n){const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function formatMonth(m){const [y,mo]=(m||localToday().slice(0,7)).split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase())}
function displayDate(d){if(!d)return '—';const [y,m,day]=d.split('-');return `${day}/${m}/${y}`}
function lastDay(m){const [y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()}
function pad(n){return String(n).padStart(2,'0')}
function clampDate(m,day){return `${m}-${pad(Math.min(Math.max(Number(day),1),lastDay(m)))}`}
function makeId(){return `${Date.now().toString(36)}_${Math.random().toString(36).slice(2,9)}`}

function cats(){return [...CATEGORY_DEFAULTS,...data.customCategories]}

function sum(arr,fn){return arr.reduce((a,x)=>a+(fn?fn(x):x),0)}

function portions(value,count){const base=Math.floor(value/count),rem=value%count;return Array.from({length:count},(_,i)=>base+(i<rem?1:0))}

function donutChart(groups,centerValue){const all=sum(groups,x=>x.value);if(!all)return empty('Ainda não há gastos','As categorias aparecerão aqui após o primeiro lançamento.');let offset=0;const rings=groups.map(g=>{const len=g.value/all*100;const circle=`<circle cx="85" cy="85" r="64" fill="none" stroke="${g.color}" stroke-width="20" stroke-dasharray="${len} ${100-len}" stroke-dashoffset="${-offset}" pathLength="100" transform="rotate(-90 85 85)"><title>${esc(g.name)}: ${money(g.value)}</title></circle>`;offset+=len;return circle}).join('');const legend=groups.slice(0,6).map(g=>`<div class="legend-item"><span class="legend-name"><span class="dot" style="background:${g.color}"></span><span>${esc(g.name)}</span></span><b>${money(g.value)}</b></div>`).join('');return `<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 170 170" role="img" aria-label="Distribuição de despesas"><circle cx="85" cy="85" r="64" fill="none" stroke="var(--border)" stroke-width="20"/>${rings}</svg><div class="donut-center"><strong>${money(centerValue??all)}</strong><span>Total registrado</span></div></div><div class="legend">${legend}${groups.length>6?`<small class="muted">+ ${groups.length-6} categorias</small>`:''}</div></div>`}
function lineGraph(month,days){const totalDays=lastDay(month),points=Array.from({length:totalDays},(_,i)=>days[i+1]||0),max=Math.max(1,...points),w=700,h=230,padX=28,top=18,bottom=190;const xy=points.map((v,i)=>[padX+i/(totalDays-1)*(w-padX-15),bottom-v/max*(bottom-top)]);const poly=xy.map(p=>p.join(',')).join(' '),area=`${padX},${bottom} ${poly} ${xy.at(-1)[0]},${bottom}`;const grid=[0,.25,.5,.75,1].map(v=>{const y=bottom-v*(bottom-top);return `<line x1="${padX}" y1="${y}" x2="${w}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 4"/><text x="0" y="${y+4}" class="chart-label">${v===0?'0':Math.round(max*v/100).toLocaleString('pt-BR')}</text>`}).join('');const labels=[1,Math.round(totalDays/4),Math.round(totalDays/2),Math.round(totalDays*.75),totalDays].map(d=>`<text x="${xy[d-1][0]}" y="218" text-anchor="middle" class="chart-label">${pad(d)}</text>`).join('');return `<div class="chart-box"><svg viewBox="0 0 720 235" preserveAspectRatio="none" role="img" aria-label="Evolução diária dos gastos"><defs><linearGradient id="trendFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#767af8" stop-opacity=".24"/><stop offset="100%" stop-color="#767af8" stop-opacity="0"/></linearGradient></defs>${grid}<polygon points="${area}" fill="url(#trendFill)"/><polyline points="${poly}" fill="none" stroke="#7275f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${xy.map((p,i)=>points[i]>0?`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#656be9" stroke="var(--surface)" stroke-width="2"><title>Dia ${i+1}: ${money(points[i])}</title></circle>`:'').join('')}${labels}</svg></div>`}
function dayGrid(month){const [y,mo]=month.split('-').map(Number),first=new Date(y,mo-1,1),start=(first.getDay()+6)%7,n=lastDay(month),total=totalBy(consumption(month)),today=localToday();const dayTotals={};const dayCounts={};consumption(month).forEach(t=>{const d=Number(t.date.slice(8));dayTotals[d]=(dayTotals[d]||0)+t.amount;dayCounts[d]=(dayCounts[d]||0)+1});let cells=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d=>`<div class="calendar-head">${d}</div>`).join('');for(let i=0;i<start;i++)cells+='<div class="calendar-day other"></div>';for(let d=1;d<=n;d++){const date=`${month}-${pad(d)}`;cells+=`<div class="calendar-day ${date===today?'today':''}"><span class="day-num">${d}</span>${dayTotals[d]?`<span class="day-money">${money(dayTotals[d])}</span><span class="day-count">${dayCounts[d]} compra(s)</span>`:''}</div>`}return `<div class="calendar">${cells}</div><div class="overview-foot"><small class="muted">Valores por data de compra</small><strong>${money(total)} no mês</strong></div>`}
function renderHabits(){const m=selectedMonth,t=consumption(m),markets=t.filter(x=>x.category==='mercado'),foods=t.filter(x=>x.category==='ifood'),merchants=new Map(),products=new Map(),weekday=[0,0,0,0,0,0,0];t.forEach(x=>{const merchant=(x.merchant||'Não informado').trim();const item=merchants.get(merchant)||{total:0,count:0};item.total+=x.amount;item.count++;merchants.set(merchant,item);const [y,mo,d]=x.date.split('-').map(Number);const day=(new Date(y,mo-1,d).getDay()+6)%7;weekday[day]+=x.amount;(x.items||[]).forEach(p=>{if(!p.label?.trim())return;const label=p.label.trim().toLocaleLowerCase('pt-BR');const old=products.get(label)||{total:0,qty:0};old.total+=Math.round((p.quantity||1)*(p.unit||0));old.qty+=Number(p.quantity)||0;products.set(label,old)})});const topMerchants=[...merchants].sort((a,b)=>b[1].total-a[1].total).slice(0,7),topProducts=[...products].sort((a,b)=>b[1].qty-a[1].qty).slice(0,7);return `<p class="intro">Entenda a frequência de compra, os estabelecimentos mais usados e os dias em que você mais consome.</p><div class="kpis">${kpi('Compras no mercado',String(markets.length),`Total ${money(totalBy(markets))}`,'basket')}${kpi('Pedidos de delivery',String(foods.length),`Total ${money(totalBy(foods))}`,'food','orange')}${kpi('Ticket médio',money(t.length?Math.round(totalBy(t)/t.length):0),'Média por lançamento','wallet','pink')}${kpi('Estabelecimentos',String(merchants.size),'Locais diferentes registrados','bag','green')}</div><div class="section-grid">${panel('Calendário de consumo','Visualize em quais dias houve despesas',dayGrid(m))}${panel('Onde você mais gasta','Ranking por total comprado',topMerchants.length?`<div class="ranking">${horizontalBar(topMerchants.map(([label,x],i)=>({index:i+1,label,sub:x.count+' compra(s)',value:x.total})),topMerchants[0][1].total)}</div>`:empty('Sem estabelecimentos','Inclua a loja ou restaurante ao registrar suas compras.'))}</div><div class="section-grid even">${panel('Gastos por dia da semana','Comparativo de function utilityHistory(month){const months=Array.from({length:6},(_,i)=>monthShift(month,i-5));const values=months.map(m=>{const t=consumption(m).filter(x=>x.category==='contas'&&x.usageValue!=null);const elec=sum(t.filter(x=>String(x.subcategory).toLowerCase().includes('energia')),x=>Number(x.usageValue)||0);const water=sum(t.filter(x=>String(x.subcategory).toLowerCase().includes('água')),x=>Number(x.usageValue)||0);const gas=sum(t.filter(x=>String(x.subcategory).toLowerCase().includes('gás')),x=>Number(x.usageValue)||0);return {month:m,elec,water,gas}});if(!values.some(x=>x.elec||x.water||x.gas))return empty('Sem leituras de consumo','Informe kWh ou m³ ao lançar faturas de água, energia ou gás.');return `<div class="table-wrap"><table class="table"><thead><tr><th>Mês</th><th>Energia (kWh)</th><th>Água (m³)</th><th>Gás (m³)</th></tr></thead><tbody>${values.map(x=>`<tr><td>${formatMonth(x.month)}</td><td>${x.elec?x.elec.toLocaleString('pt-BR'): '—'}</td><td>${x.water?x.water.toLocaleString('pt-BR'): '—'}</td><td>${x.gas?x.gas.toLocaleString('pt-BR'): '—'}</td></tr>`).join('')}</tbody></table></div>`}

function parseCSV(text){text=text.replace(/^\ufeff/,'');const first=text.split(/\r?\n/,1)[0]||'';const delim=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';let rows=[],current=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else{if(c==='"')quoted=true;else if(c===delim){current.push(cell);cell=''}else if(c==='\r'&&text[i+1]==='\n'){current.push(cell);rows.push(current);current=[];cell='';i++}else if(c==='\n'||c==='\r'){current.push(cell);rows.push(current);current=[];cell=''}else cell+=c}}if(cell.length||current.length){current.push(cell);rows.push(current)}return rows.filter(row=>row.some(c=>c.trim()))}
function canonicalDate(s){s=String(s||'').trim();if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)){const [d,m,y]=s.split('/');return `${y}-${m}-${d}`}return s}
async function compressImage(file){if(!file.type.startsWith('image/'))throw Error('Selecione um arquivo de imagem.');if(file.size>12*1024*1024)throw Error('Imagem muito grande (limite de 12 MB).');const src=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(file)});const image=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src});const scale=Math.min(1,900/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);const out=canvas.toDataURL('image/jpeg',.68);if(out.length>800000)throw Error('Imagem compactada ainda muito grande. Use um comprovante menor.');return out}

// ===== Nexo v2 · formas de pagamento =====
// "card" continua indicando de quem saiu o dinheiro (meu cartão/conta ou do meu pai);
// "method" indica se o valor vai para a fatura (credit) ou foi pago na hora (pix/debit).
const METHODS={credit:{label:'Fatura',long:'Crédito (fatura)',icon:'card',pill:'purple',color:'var(--m-credit)',help:'Entra na fatura do cartão, conforme a data de fechamento.'},pix:{label:'Pix',long:'Pix',icon:'zap',pill:'green',color:'var(--m-pix)',help:'Pago na hora por Pix. Não entra em nenhuma fatura.'},debit:{label:'Débito',long:'Débito',icon:'wallet',pill:'orange',color:'var(--m-debit)',help:'Debitado na hora da conta. Não entra em nenhuma fatura.'}};
const MEASURES=['un','kg','g','L','ml','pct','cx','dz'];
function isMethod(x){return typeof x==='string'&&Object.hasOwn(METHODS,x)}
function methodOf(t){return isMethod(t?.method)?t.method:'credit'}
function isCredit(t){return methodOf(t)==='credit'}
function currentMethod(){const v=document.querySelector('#modalRoot [name="method"]:checked')?.value;return isMethod(v)?v:'credit'}
function methodPills(selected='credit'){return `<div class="radio-pills">${Object.entries(METHODS).map(([id,m])=>`<label class="radio-pill"><input type="radio" name="method" value="${id}" ${id===selected?'checked':''}><span>${icon(m.icon,14)}${m.label}</span></label>`).join('')}</div>`}
function methodSplit(list){const total=totalBy(list);if(!total)return '';const parts=Object.keys(METHODS).map(id=>({id,...METHODS[id],value:sum(list,t=>methodOf(t)===id?t.amount:0)})).filter(p=>p.value>0);return `<div class="tiny-text muted" style="margin-top:16px">Como as compras deste mês foram pagas</div><div class="method-track" role="img" aria-label="${esc(parts.map(p=>`${p.label}: ${money(p.value)}`).join(', '))}">${parts.map(p=>`<span style="flex:${p.value} 1 0;background:${p.color}" data-tip="${esc(`${p.long}: ${money(p.value)} (${roundPct(p.value,total)}%)`)}"></span>`).join('')}</div><div class="method-legend">${parts.map(p=>`<span><span class="dot" style="background:${p.color}"></span> ${p.label}<b>${money(p.value)}</b></span>`).join('')}</div>`}
function renderBottomNav(){const el=document.getElementById('bottomNav');if(!el)return;const main=[['overview','Início'],['transactions','Gastos'],['market','Mercado'],['cards','Fatura']];el.innerHTML=main.map(([id,l])=>`<button type="button" class="${view===id?'active':''}" data-nav="${id}" ${view===id?'aria-current="page"':''}>${icon(NAV.find(n=>n.id===id).icon,20)}<span>${l}</span></button>`).join('')+`<button type="button" class="${main.some(([id])=>id===view)?'':'active'}" data-action="open-menu">${icon('menu',20)}<span>Mais</span></button>`}

function normMarket(m){const ok=m&&typeof m==='object';return {products:ok&&Array.isArray(m.products)?m.products.filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string'):[],list:ok&&m.list&&typeof m.list==='object'?m.list:{}}}

// ===== Nexo v3 · somente os meus gastos; contas fixas descontadas no mês da cobrança =====
function defaultData(){return {version:3,solo:true,transactions:[],recurring:[],budgets:{},salary:[{from:'2026-01',amount:250000}],cards:[{id:'mine',name:'Meu cartão',closing:25,due:5}],billPaid:{},customCategories:[],savingsTarget:0,theme:'light',market:{products:[],list:{}}}}
// Converte dados antigos (com a parte do pai) para o formato individual. Nada é apagado:
// o que sai dos cálculos fica em "legacyShared" e segue junto no backup JSON.
function migrateSolo(v){if(v.solo)return false;const legacy={transactions:[],recurring:[],settlements:Array.isArray(v.settlements)?v.settlements:[],splits:{}};
 const mineOnly=list=>{const keep=[];for(const x of list){if(!x||typeof x!=='object')continue;const mine=Number.isInteger(x.mine)?Math.min(x.mine,x.amount):x.amount;if(!(mine>0)){legacy[list===v.transactions?'transactions':'recurring'].push(x);continue}if(mine<x.amount||x.card==='dad')legacy.splits[x.id]={amount:x.amount,mine,card:x.card};x.amount=mine;x.card='mine';delete x.mine;keep.push(x)}return keep};
 v.transactions=mineOnly(v.transactions);v.recurring=mineOnly(v.recurring);delete v.settlements;if(v.billPaid&&typeof v.billPaid==='object')for(const k of Object.keys(v.billPaid))if(!k.startsWith('mine:'))delete v.billPaid[k];
 if(legacy.transactions.length||legacy.recurring.length||legacy.settlements.length||Object.keys(legacy.splits).length)v.legacyShared=legacy;v.solo=true;v.version=3;return true}
function loadData(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(!v||!Array.isArray(v.transactions))return defaultData();const base=defaultData();v.recurring=Array.isArray(v.recurring)?v.recurring:[];migratedNow=migrateSolo(v);const card=(Array.isArray(v.cards)?v.cards:[]).find(c=>c&&c.id==='mine')||base.cards[0];return {...base,...v,cards:[card],salary:Array.isArray(v.salary)&&v.salary.length?v.salary:base.salary,budgets:v.budgets||{},billPaid:v.billPaid||{},customCategories:Array.isArray(v.customCategories)?v.customCategories:[],market:normMarket(v.market)}}catch(e){console.warn('Não foi possível abrir os dados locais',e);return defaultData()}}

// --- cálculo ---
function schedule(tx){if(!isCredit(tx))return [{tx,month:monthOf(tx.date),amount:tx.amount,i:1,n:1,direct:true}];const n=Math.max(1,Math.min(120,Number(tx.installments)||1)),start=dueMonth(tx.date,data.cards[0]);return portions(tx.amount,n).map((v,i)=>({tx,month:monthShift(start,i),amount:v,i:i+1,n}))}
function invalidateBillStatus(tx){if(!tx||!isCredit(tx))return;for(const e of schedule(tx))delete data.billPaid[`mine:${e.month}`]}
function billEntries(month){return data.transactions.filter(isCredit).flatMap(t=>schedule(t).filter(x=>x.month===month))}
function billStats(month){const entries=billEntries(month);return {entries,total:sum(entries,e=>e.amount)}}
function totals(month){const t=consumption(month);return {total:totalBy(t),count:t.length}}
function directStats(month){const list=consumption(month).filter(t=>!isCredit(t));return {list,total:totalBy(list),pix:sum(list,t=>methodOf(t)==='pix'?t.amount:0),debit:sum(list,t=>methodOf(t)==='debit'?t.amount:0)}}
// Contas fixas (recorrências): contam no mês em que são cobradas, lançadas ou não.
// Lançada = usa o valor real do lançamento; prevista = usa o valor cadastrado.
function isFixedTx(t){return !!(t.recurringId&&t.recurringMonth)}
function fixedStats(month){const posted=data.transactions.filter(t=>isFixedTx(t)&&t.recurringMonth===month),pending=recurringPending(month);return {posted,pending,total:totalBy(posted)+totalBy(pending),count:posted.length+pending.length}}
// Saídas do mês = contas fixas do mês + fatura que vence + Pix/débito.
// Lançamentos gerados por recorrência ficam fora de "fatura" e "Pix/débito" para não contar em dobro.
function outflow(month){const bill=billStats(month),direct=directStats(month),fixed=fixedStats(month),bills=bill.total-sum(bill.entries,e=>isFixedTx(e.tx)?e.amount:0),dir=direct.total-sum(direct.list,t=>isFixedTx(t)?t.amount:0);return {bill,direct,fixed,bills,dir,total:bills+dir+fixed.total}}

function payText(t){return METHODS[methodOf(t)].long}

function directPanel(month){const d=directStats(month),rows=[...d.list].sort((a,b)=>b.date.localeCompare(a.date));return panel('Fora da fatura','Pagamentos por Pix e débito feitos em '+formatMonth(month),rows.length?`<div class="stat-strip" style="border-top:0;margin-top:0;padding-top:0"><div class="stat-item"><small>Pix</small><b>${money(d.pix)}</b></div><div class="stat-item"><small>Débito</small><b>${money(d.debit)}</b></div></div><div class="statement-list">${rows.map(t=>`<div class="statement-row"><div><strong>${esc(t.description)}</strong><small>${esc(getCat(t.category).name)} · ${displayDate(t.date)}${isFixedTx(t)?' · conta fixa':''}</small></div><div class="flex-align">${payPill(t)}<strong>${money(t.amount)}</strong></div></div>`).join('')}</div>`:empty('Nenhum Pix ou débito neste mês','Ao lançar um gasto, escolha Pix ou Débito em "Como foi pago?" para ele aparecer aqui, fora da fatura.'))}

function overviewTxRows(list){if(!list.length)return empty('Nenhum gasto lançado',`O mês de ${formatMonth(selectedMonth).toLowerCase()} ainda está sem registros.`,true);return `<div class="table-wrap"><table class="table"><thead><tr><th>Descrição</th><th>Data</th><th>Pagamento</th><th class="text-right">Total</th></tr></thead><tbody>${list.map(t=>`<tr><td><div class="transaction-name">${catIcon(t.category)}<div class="name-ellipsis"><strong>${esc(t.description)}</strong><small>${esc(getCat(t.category).name)}${t.merchant?' · '+esc(t.merchant):''}</small></div></div></td><td>${displayDate(t.date)}</td><td>${payPill(t)}</td><td class="text-right amount-main">${money(t.amount)}</td></tr>`).join('')}</tbody></table></div>`}
function tipsFor(month){const t=consumption(month),prev=consumption(monthShift(month,-1)),out=[],prevTotal=totalBy(prev),total=totalBy(t);if(t.length&&prevTotal>0){const change=Math.round((total-prevTotal)/prevTotal*100);out.push({title:`Gastos ${change>=0?'aumentaram':'diminuíram'} ${Math.abs(change)}%`,body:`Comparação entre ${formatMonth(month)} e ${formatMonth(monthShift(month,-1))}.`,icon:'trend'})}
 for(const id of ['ifood','mercado']){const arr=t.filter(x=>x.category===id),one=arr.length===1;if(arr.length)out.push({title:`${arr.length} ${id==='ifood'?(one?'pedido de delivery':'pedidos de delivery'):(one?'compra no mercado':'compras no mercado')}`,body:`Média por compra: ${money(Math.round(totalBy(arr)/arr.length))}.`,icon:id==='ifood'?'food':'basket'})}
 const pay=income(month),o=outflow(month);if(pay&&o.total/pay>=.8)out.push({title:'Atenção ao seu orçamento',body:`As saídas do mês já somam ${roundPct(o.total,pay)}% da sua renda.`,icon:'alert'});if(o.fixed.pending.length)out.push({title:`${o.fixed.pending.length} conta(s) fixa(s) a confirmar`,body:'Já saem do saldo pelo valor previsto. Lance cada uma para registrar o valor real.',icon:'repeat'});
 if(!out.length)out.push({title:'Comece pelo primeiro lançamento',body:'Registre mercado, delivery, contas ou compras online. Seus insights aparecerão conforme os dados crescerem.',icon:'info'});return out.slice(0,4).map(t=>`<div class="tip"><span class="tip-icon">${icon(t.icon,15)}</span><span class="tip-body"><strong>${esc(t.title)}</strong>${esc(t.body)}</span></div>`).join('')}
function outflowRows(o){const row=(l,s,v)=>`<div class="statement-row"><div><strong>${l}</strong><small>${s}</small></div><strong>${money(v)}</strong></div>`;return `<div class="statement-list">${row('Contas e assinaturas',o.fixed.count?`${o.fixed.pending.length} prevista(s) · ${o.fixed.posted.length} lançada(s)`:'Nenhuma neste mês',o.fixed.total)}${row('Fatura do cartão','Parcelas que vencem no mês, sem as contas fixas',o.bills)}${row('Pix e débito','Pagos na hora, sem as contas fixas',o.dir)}</div><div class="mini-stat mt-16"><label>Total de saídas</label><strong>${money(o.total)}</strong></div>`}
function fixedList(month,limit=6){const f=fixedStats(month),rows=[...f.pending.map(r=>({name:r.description,cat:r.category,amount:r.amount,day:r.day,pay:payText(r),posted:false})),...f.posted.map(t=>({name:t.description,cat:t.category,amount:t.amount,day:Number(t.date.slice(8)),pay:payText(t),posted:true}))].sort((a,b)=>a.day-b.day);if(!rows.length)return empty('Nenhuma conta fixa neste mês','Cadastre aluguel, internet e assinaturas: elas passam a sair da sua renda automaticamente.');return `<div class="statement-list">${rows.slice(0,limit).map(x=>`<div class="statement-row"><div class="flex-align">${catIcon(x.cat)}<div><strong>${esc(x.name)}</strong><small>Dia ${x.day} · ${esc(x.pay)}</small></div></div><div class="flex-align"><span class="pill ${x.posted?'green':'orange'}">${x.posted?'Lançada':'Prevista'}</span><strong>${money(x.amount)}</strong></div></div>`).join('')}</div>${rows.length>limit?`<small class="muted">+ ${rows.length-limit} em Contas e assinaturas</small>`:''}`}
function renderOverview(){const m=selectedMonth,stat=totals(m),o=outflow(m),salary=income(m),balance=salary-o.total,list=consumption(m),bycat=groupCat(list),days={};list.forEach(t=>{const d=Number(t.date.slice(8));days[d]=(days[d]||0)+t.amount});const rows=[...list].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
 return `<p class="intro">Acompanhe seus gastos, o que cai na fatura, o que saiu por Pix ou débito e quanto da renda já está comprometido com contas fixas.</p><div class="kpis">${kpi('Renda mensal',money(salary),'Valor configurado para este mês','wallet')}${kpi('Gastos do mês',money(stat.total),`${stat.count} lançamento(s) pela data da compra`,'receipt','orange')}${kpi('Contas e assinaturas',money(o.fixed.total),o.fixed.count?`Já descontadas da renda · ${o.fixed.pending.length} prevista(s), ${o.fixed.posted.length} lançada(s)`:'Nenhuma conta fixa neste mês','repeat','pink')}${kpi('Saldo do mês',money(balance),'Renda menos contas fixas, fatura e Pix/débito','trend','green',balance<0?'neg':'positive')}</div><div class="section-grid">${panel('Evolução dos gastos','Valores diários por data de compra · '+formatMonth(m),lineGraph(m,days))}${panel('Gastos por categoria','Distribuição dos seus gastos no mês',donutChart(bycat,stat.total))}</div><div class="section-grid even">${panel('Saídas do mês','O que sai da sua renda em '+formatMonth(m),outflowRows(o)+methodSplit(list)+`<div class="overview-foot"><span class="tiny-text muted">Contas fixas contam no mês da cobrança, mesmo quando vão para a fatura.</span><button class="button subtle small" data-nav="cards">Ver fatura ${icon('arrow',14)}</button></div>`)}${panel('Contas e assinaturas','Descontadas automaticamente em '+formatMonth(m),fixedList(m),`<button class="button ghost small" data-nav="recurring">Gerenciar ${icon('arrow',14)}</button>`)}</div><div class="section-grid">${panel('Últimos lançamentos','Despesas registradas neste mês',overviewTxRows(rows),`<button class="button ghost small" data-nav="transactions">Ver todos ${icon('arrow',14)}</button>`)}${panel('Insights do seu mês','Análises automáticas baseadas nos seus registros',`<div class="tips">${tipsFor(m)}</div>`)}</div>`}

function renderCards(){const m=selectedMonth,card=data.cards[0],stat=billStats(m),nextM=monthShift(m,1),next=billStats(nextM),paid=data.billPaid[`mine:${m}`],direct=directStats(m),future=sum(data.transactions.filter(isCredit),t=>sum(schedule(t),e=>e.month>m?e.amount:0));
 return `<p class="intro">Veja o que vence na fatura do mês, as parcelas que ainda virão e o que foi pago fora do cartão.</p><div class="kpis">${kpi('Fatura do mês',money(stat.total),`Vence dia ${card.due} · ${paid?'marcada como paga':'prevista'}`,'receipt')}${kpi('Próxima fatura',money(next.total),formatMonth(nextM),'calendar','orange')}${kpi('Parcelas futuras',money(future),'Já comprometido nas faturas seguintes','layers','pink')}${kpi('Pix e débito',money(direct.total),'Pagos na hora neste mês','zap','green')}</div><div class="section-grid even"><section class="panel"><div class="credit-card mine"><div class="card-head"><span>${esc(card.name)}</span>${icon('card',23)}</div><div><small>Valor previsto da fatura</small><div class="card-total">${money(stat.total)}</div><small>${formatMonth(m)}</small></div><div class="card-foot"><span>Fecha dia ${card.closing} · Vence dia ${card.due}</span><span>${paid?'PAGA':'PREVISTA'}</span></div></div><div class="flex-between mt-16"><div><strong class="subheading">Lançamentos da fatura</strong><div class="tiny-text muted">${stat.entries.length} parcela(s)</div></div><button class="button ${paid?'subtle':'outline'} small" data-action="toggle-paid" ${stat.total<=0?'disabled':''}>${icon(paid?'check':'clock',15)} ${paid?'Marcar pendente':'Marcar paga'}</button></div><div class="statement-list">${stat.entries.length?stat.entries.sort((a,b)=>a.tx.date.localeCompare(b.tx.date)).map(p=>`<div class="statement-row"><div><strong>${esc(p.tx.description)}</strong><small>${esc(getCat(p.tx.category).name)} · ${p.n>1?`Parcela ${p.i}/${p.n}`:'À vista'}${isFixedTx(p.tx)?' · conta fixa':''}</small></div><strong>${money(p.amount)}</strong></div>`).join(''):empty('Sem parcelas neste mês','Compras futuras aparecerão conforme a data de fechamento.')}</div></section>${directPanel(m)}</div><div class="notice mt-20"><strong>Como os valores são calculados?</strong>O gasto pertence ao mês da compra. Uma compra parcelada é dividida entre as faturas futuras, e marcar a fatura como paga não cria nova despesa. Pix e débito não entram em fatura: contam no mês em que foram feitos. Contas fixas no crédito aparecem aqui na fatura, mas no saldo do mês já foram descontadas no mês da cobrança.</div>`}

// --- contas e assinaturas ---
function renderRecurring(){const m=selectedMonth,f=fixedStats(m),pending=f.pending,active=data.recurring.filter(r=>r.active),monthlyEquivalent=sum(active,r=>r.frequency==='monthly'?r.amount:Math.round(r.amount/12));const freqLabel=x=>x==='yearly'?'Anual':'Mensal';
 return `<p class="intro">Cadastre contas fixas e assinaturas uma vez. Elas passam a sair da sua renda em todo mês de cobrança, sem precisar lançar.</p><div class="kpis">${kpi('Recorrências ativas',String(active.length),'Contas e assinaturas cadastradas','repeat')}${kpi('Custo mensal médio',money(monthlyEquivalent),'Anuais rateadas por 12 para referência','wallet','orange')}${kpi('Descontado neste mês',money(f.total),`Já sai da renda de ${formatMonth(m).toLowerCase()}`,'receipt','pink')}${kpi('A confirmar',String(pending.length),'Previstas, ainda pelo valor cadastrado','clock','green')}</div><section class="panel mt-20"><div class="panel-head"><div><h2 class="panel-title">Contas recorrentes</h2><div class="panel-sub">Assinaturas, aluguel, internet, energia e outras despesas fixas</div></div><button class="button primary small" data-action="add-recurring">${icon('plus')} Nova recorrência</button></div>${data.recurring.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Despesa</th><th>Valor</th><th>Frequência</th><th>Vence dia</th><th>Pagamento</th><th>Status</th><th class="text-right">Ações</th></tr></thead><tbody>${data.recurring.map(r=>`<tr><td><div class="transaction-name">${catIcon(r.category)}<div class="name-ellipsis"><strong>${esc(r.description)}</strong><small>${esc(getCat(r.category).name)}${r.subcategory?' · '+esc(r.subcategory):''}</small></div></div></td><td class="amount-main">${money(r.amount)}</td><td>${freqLabel(r.frequency)}</td><td>${r.day}</td><td>${payPill(r)}</td><td><span class="pill ${r.active?'green':'red'}">${r.active?'Ativa':'Pausada'}</span></td><td><div class="tiny-actions"><button class="button ghost tiny" data-action="toggle-recurring" data-id="${esc(r.id)}" aria-label="Ativar ou pausar">${icon('refresh',15)}</button><button class="button ghost tiny" data-action="edit-recurring" data-id="${esc(r.id)}" aria-label="Editar">${icon('edit',15)}</button><button class="button ghost tiny" data-action="delete-recurring" data-id="${esc(r.id)}" aria-label="Excluir" style="color:var(--danger)">${icon('trash',15)}</button></div></td></tr>`).join('')}</tbody></table></div>`:empty('Nenhuma conta recorrente','Cadastre as contas para que saiam da sua renda automaticamente.')}<div class="notice mt-16"><strong>O desconto é imediato.</strong>Toda recorrência ativa já entra no saldo do mês em que é cobrada, pelo valor cadastrado. "Lançar" serve para confirmar o valor real e levar a despesa ao histórico e à fatura; o saldo não conta a mesma conta duas vezes. Pausar uma recorrência tira o desconto dos meses ainda não lançados.</div></section>${panel('A confirmar em '+formatMonth(m),'Ajuste valores variáveis ao lançar (energia, água...)',pending.length?`<div class="statement-list">${pending.map(r=>`<div class="statement-row"><div><strong>${esc(r.description)}</strong><small>Cobrança no dia ${r.day} · ${esc(payText(r))}</small></div><div class="flex-align"><strong>${money(r.amount)}</strong><button class="button subtle small" data-action="post-recurring" data-id="${esc(r.id)}">Lançar</button></div></div>`).join('')}</div><button class="button primary small mt-16" data-action="post-all-recurring">${icon('plus')} Lançar todas</button>`:empty('Tudo confirmado','Não há recorrências a confirmar neste mês.'),'')}`}
function recurringModal(r){const cat=r?.category||'assinaturas',m=methodOf(r);const content=`<div class="form-grid">${field('Nome da conta / assinatura *',`<input class="input" id="recDesc" name="description" maxlength="120" value="${esc(r?.description||'')}" placeholder="Ex.: Internet residencial" required>`,'recDesc')}${field('Valor previsto (R$) *',`<input class="input" id="recAmount" name="amount" type="number" min="0.01" step="0.01" value="${r?num(r.amount):''}" required>`,'recAmount')}${field('Categoria',`<select class="select" id="recCat" name="category">${catOptions(cat)}</select>`,'recCat')}${field('Subcategoria',`<select class="select" name="subcategory" id="recSubcat">${subOptions(cat,r?.subcategory||'')}</select>`,'recSubcat')}${field('Periodicidade',`<select class="select" id="recFreq" name="frequency"><option value="monthly" ${r?.frequency!=='yearly'?'selected':''}>Mensal</option><option value="yearly" ${r?.frequency==='yearly'?'selected':''}>Anual</option></select>`,'recFreq')}${field('Dia da cobrança',`<input class="input" id="recDay" name="day" type="number" min="1" max="28" value="${r?.day||10}" required>`,'recDay')}<div class="field span-2"><label for="recStart">Desconta da renda a partir de</label><input class="input" id="recStart" name="start" type="month" value="${r?.start||selectedMonth}" required><small>Nas anuais, este também é o mês da cobrança.</small></div><div class="field span-2"><label>Forma de pagamento</label>${methodPills(m)}<small id="methodHelp">${METHODS[m].help}</small></div></div>`;return modalLayout(r?'Editar recorrência':'Nova conta recorrente','O valor passa a sair da sua renda em cada mês de cobrança.',content,r?'Salvar alterações':'Cadastrar recorrência','recurringForm')}
function submitRecurring(form){const fd=new FormData(form),amount=toCents(fd.get('amount')),description=String(fd.get('description')||'').trim(),day=Number(fd.get('day')),start=String(fd.get('start')),category=String(fd.get('category'));if(!description||!Number.isFinite(amount)||amount<=0||!Number.isInteger(day)||day<1||day>28||!/^\d{4}-\d{2}$/.test(start))throw Error('Preencha corretamente os dados da recorrência.');const prev=editingId?data.recurring.find(x=>x.id===editingId):null;const r={id:editingId||makeId(),description,amount,day,start,card:'mine',method:isMethod(fd.get('method'))?fd.get('method'):'credit',category,subcategory:String(fd.get('subcategory')||''),frequency:fd.get('frequency')==='yearly'?'yearly':'monthly',active:prev?prev.active:true};if(prev)data.recurring[data.recurring.findIndex(x=>x.id===editingId)]=r;else data.recurring.push(r);save();closeModal();render();notify(recurringIsDue(r,selectedMonth)?`Recorrência salva: ${money(amount)} já saem do saldo de ${formatMonth(selectedMonth).toLowerCase()}.`:'Recorrência salva.')}
function postRecurring(r){if(!r||!recurringIsDue(r,selectedMonth))return false;if(data.transactions.some(t=>t.recurringId===r.id&&t.recurringMonth===selectedMonth))return false;const tx={id:makeId(),createdAt:new Date().toISOString(),date:clampDate(selectedMonth,r.day),description:r.description,merchant:'',category:r.category,subcategory:r.subcategory||'',amount:r.amount,card:'mine',method:methodOf(r),installments:1,notes:`Gerado a partir de recorrência ${r.frequency==='yearly'?'anual':'mensal'}. Confirme o valor real.`,items:[],receipt:'',recurringId:r.id,recurringMonth:selectedMonth};data.transactions.push(tx);invalidateBillStatus(tx);return true}

// --- orçamento ---
function renderBudgets(){const month=selectedMonth,inc=income(month),o=outflow(month),target=data.savingsTarget||0,spend=consumption(month),limits=Object.entries(data.budgets).filter(([,v])=>v>0),left=inc-o.total-target;
 return `<p class="intro">Defina limites por categoria e acompanhe quanto da renda já está comprometido.</p><div class="kpis">${kpi('Renda do mês',money(inc),'Pode ser alterada com vigência','wallet')}${kpi('Saídas do mês',money(o.total),'Contas fixas, fatura e Pix/débito','receipt','orange')}${kpi('Reserva planejada',money(target),'Meta opcional; não é gasto','target','green')}${kpi('Após saídas e reserva',money(left),'Quanto sobra da renda neste mês','trend','pink',left<0?'neg':'positive')}</div><div class="section-grid">${panel('Limites por categoria','O uso considera as compras feitas neste mês',cats().map(c=>{const used=sum(spend,t=>t.category===c.id?t.amount:0),limit=data.budgets[c.id]||0,pct=roundPct(used,limit);return `<div class="budget-row"><div class="progress-header"><div class="flex-align">${catIcon(c.id)}<div><strong>${esc(c.name)}</strong><div class="tiny-text muted">${limit?`${pct}% do limite utilizado`:'Sem limite definido'}</div></div></div><div class="flex-align"><label class="tiny-text muted" for="budget_${c.id}">R$</label><input class="input limit-edit" type="number" step="0.01" min="0" id="budget_${c.id}" data-budget="${c.id}" value="${limit?num(limit):''}" placeholder="0,00"></div></div><div class="thin-progress"><span style="width:${limit?Math.min(100,pct):0}%;background:${limit&&pct>=100?'var(--danger)':limit&&pct>=80?'var(--warning)':c.color}"></span></div><div class="values"><span>Gasto: ${money(used)}</span><span>${limit?`Limite: ${money(limit)}`:'Defina uma meta'}</span></div></div>`}).join('')+`<div class="overview-foot"><span class="tiny-text muted">Alerta visual a partir de 80% do limite.</span><button class="button primary small" data-action="save-budgets">Salvar limites</button></div>`)}${panel('Planejamento pessoal','Sua renda e os compromissos do mês',`<div class="month-tile"><span>Renda configurada</span><strong>${money(inc)}</strong></div><div class="month-tile mt-16"><span>Contas e assinaturas do mês</span><strong>${money(o.fixed.total)}</strong></div><div class="month-tile mt-16"><span>Fatura que vence no mês (sem contas fixas)</span><strong>${money(o.bills)}</strong></div><div class="month-tile mt-16"><span>Pix e débito no mês (sem contas fixas)</span><strong>${money(o.dir)}</strong></div><div class="divider"></div><div class="field"><label for="savingTarget">Reserva / investimento mensal planejado (R$)</label><input class="input" id="savingTarget" type="number" min="0" step="0.01" value="${num(target)}"><small>Planejamento, não saída real de caixa. Investimentos não são contados como compras.</small></div><button class="button outline small mt-16" data-action="save-saving">Salvar planejamento</button><div class="notice mt-16">${limits.length} limite(s) ativos. O saldo muda conforme novas compras, parcelas e contas são registradas.</div>`)}</div>`}

// --- relatórios ---
function renderReports(){const y=selectedMonth.slice(0,4),months=Array.from({length:12},(_,i)=>`${y}-${pad(i+1)}`),rows=months.map(m=>({month:m,...totals(m),out:outflow(m),inc:income(m)}));const yearly=sum(rows,r=>r.total),yearOut=sum(rows,r=>r.out.total),yearFixed=sum(rows,r=>r.out.fixed.total),highest=[...rows].sort((a,b)=>b.total-a.total)[0];
 return `<p class="intro">Compare meses, veja quanto saiu da renda em cada um e exporte seus registros para análise ou backup.</p><div class="toolbar"><button class="button outline small" data-action="export-csv">${icon('download')} Exportar despesas CSV</button><button class="button outline small" data-action="export-json">${icon('download')} Backup completo JSON</button><button class="button outline small" data-action="print">${icon('receipt')} Salvar relatório em PDF</button></div><div class="kpis">${kpi('Gastos do ano',money(yearly),`Compras registradas em ${y}`,'receipt')}${kpi('Média mensal',money(Math.round(yearly/12)),'Total dividido por 12 meses','chart','orange')}${kpi('Contas fixas no ano',money(yearFixed),'Lançadas e previstas até dezembro','repeat','pink')}${kpi('Saídas do ano',money(yearOut),'Contas fixas, faturas e Pix/débito','wallet','green')}</div><div class="section-grid">${panel('Gastos por mês · '+y,'Compras pela data em que foram feitas, em reais',`<div class="chart-box" style="height:245px">${yearBars(rows)}</div>`)}${panel('Destaques anuais','Comparações do período selecionado',`<div class="month-tile"><span>Mês de maior gasto</span><strong>${highest.total?formatMonth(highest.month):'—'}</strong><small class="muted">${money(highest.total)}</small></div><div class="month-tile mt-16"><span>Faturas que vencem no ano</span><strong>${money(sum(rows,r=>r.out.bill.total))}</strong></div><div class="month-tile mt-16"><span>Pix e débito no ano</span><strong>${money(sum(rows,r=>r.out.direct.total))}</strong></div>`)}</div>${panel('Resumo de todos os meses','Gastos pela data da compra; saídas pelo mês em que pesam na renda',`<div class="table-wrap"><table class="table"><thead><tr><th>Mês</th><th>Compras</th><th>Gastos</th><th>Contas fixas</th><th>Fatura</th><th>Pix/débito</th><th class="text-right">Saldo do mês</th></tr></thead><tbody>${rows.map(r=>{const bal=r.inc-r.out.total;return `<tr><td class="name-cell">${formatMonth(r.month)}</td><td>${r.count}</td><td>${money(r.total)}</td><td>${money(r.out.fixed.total)}</td><td>${money(r.out.bills)}</td><td>${money(r.out.dir)}</td><td class="text-right amount-main ${bal<0?'neg':''}">${money(bal)}</td></tr>`}).join('')}</tbody></table></div>`)}<div class="notice mt-20">"Gastos" soma o valor integral de cada compra no mês em que ela ocorreu. As três colunas seguintes mostram o que pesa na renda de cada mês: contas fixas no mês da cobrança, parcelas da fatura que vence e pagamentos por Pix ou débito, sem contar nada em dobro. Meses futuros já incluem as contas fixas previstas.</div>`}
function yearBars(rows){const max=Math.max(1,...rows.map(r=>r.total)),labels=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'],w=710,left=35,right=8,top=12,bottom=215,plotH=bottom-top,groupW=(w-left-right)/12;let svg='';for(let i=0;i<5;i++){const y=bottom-(i/4)*plotH;svg+=`<line x1="${left}" y1="${y}" x2="${w-right}" y2="${y}" stroke="var(--border)" stroke-dasharray="4 4"/><text x="4" y="${y+3}" class="chart-label">${Math.round(max*i/400)}</text>`}rows.forEach((r,i)=>{const barW=groupW*.5,x=left+i*groupW+(groupW-barW)/2,h1=r.total/max*plotH,cur=r.month===selectedMonth;svg+=`<rect class="bar" x="${x}" y="${bottom-h1}" width="${barW}" height="${h1}" rx="3" fill="${cur?'var(--m-credit)':'var(--bar-soft)'}" data-tip="${esc(`${formatMonth(r.month)}: ${money(r.total)}`)}"/><text x="${left+i*groupW+groupW*.5}" y="236" text-anchor="middle" class="chart-label ${cur?'strong':''}">${labels[i]}</text>`});return `<svg viewBox="0 0 710 245" preserveAspectRatio="none" width="100%" height="100%" role="img" aria-label="${esc('Gastos por mês: '+rows.map(r=>`${formatMonth(r.month)} ${money(r.total)}`).join('; '))}">${svg}</svg>`}

// --- lançamento de gasto ---
function expenseModal(t){const cat=t?.category||'mercado';currentReceipt=t?.receipt||'';const content=`<div class="form-grid">${field('Data da compra *',`<input class="input" id="expDate" name="date" type="date" value="${esc(t?.date||localToday())}" required>`,'expDate')}${field('Valor total (R$) *',`<input class="input" id="expAmount" name="amount" type="number" min="0.01" step="0.01" placeholder="0,00" value="${t?num(t.amount):''}" required>`,'expAmount')}${field('Descrição *',`<input class="input" id="expDesc" name="description" maxlength="130" placeholder="Ex.: Supermercado da semana" value="${esc(t?.description||'')}" required>`,'expDesc')}${field('Estabelecimento / loja',`<input class="input" id="expMerchant" name="merchant" list="merchantSuggestions" maxlength="100" placeholder="Ex.: Amazon, iFood, Assaí" value="${esc(t?.merchant||'')}"><datalist id="merchantSuggestions"><option value="Amazon"><option value="Mercado Livre"><option value="Shein"><option value="Shopee"><option value="Magalu"><option value="iFood"><option value="Uber"><option value="99"></datalist>`,'expMerchant')}${field('Categoria *',`<select class="select" id="expCategory" name="category">${catOptions(cat)}</select>`,'expCategory')}${field('Subcategoria / tipo de compra',`<select class="select" id="expSubcat" name="subcategory">${subOptions(cat,t?.subcategory||'')}</select>`,'expSubcat')}${paymentFields(t)}<div class="field span-2"><label for="expNotes">Observações</label><textarea class="textarea" rows="2" maxlength="1200" id="expNotes" name="notes" placeholder="Produtos, frequência, detalhes ou outras informações...">${esc(t?.notes||'')}</textarea></div><div class="field span-2" id="usageField" style="display:${cat==='contas'?'grid':'none'}"><label for="expUsage">Consumo medido na fatura (opcional)</label><div class="range-box"><input class="input" id="expUsage" name="usage" type="number" min="0" step="0.01" placeholder="Ex.: 95,5" value="${t?.usageValue??''}"><select class="select" name="usageUnit" style="max-width:140px"><option value="kWh" ${t?.usageUnit!=='m³'?'selected':''}>kWh</option><option value="m³" ${t?.usageUnit==='m³'?'selected':''}>m³</option></select></div><small>Para acompanhar o consumo de energia, água ou gás.</small></div></div><div class="divider"></div><div class="flex-between mb-14"><div><strong class="subheading">Itens da compra (opcional)</strong><div class="tiny-text muted" style="margin-top:5px">Informe produtos, quantidades e preços para analisar o consumo.</div></div><button class="button subtle small" type="button" data-modal-action="add-item">${icon('plus')} Item</button></div><div id="itemRows" class="inline-items">${(t?.items||[]).map(lineItemRow).join('')}</div><div class="overview-foot"><small class="muted" id="itemsSum">Detalhamento opcional</small><button class="button outline tiny" type="button" data-modal-action="apply-items">Usar soma dos itens</button></div><div class="divider"></div><div class="field"><label for="expReceipt">Foto do comprovante (opcional)</label><input class="input" type="file" id="expReceipt" accept="image/jpeg,image/png,image/webp"><small>A imagem será reduzida para economizar espaço no navegador.</small><div id="receiptPreview">${currentReceipt?`<div class="flex-align"><a href="${currentReceipt}" target="_blank" rel="noopener" class="tiny-text">Visualizar comprovante salvo</a><button class="button ghost tiny" type="button" data-modal-action="remove-receipt">${icon('trash')} Remover</button></div>`:''}</div></div>`;return modalLayout(t?'Editar despesa':'Novo lançamento','Registre a compra e diga como foi paga.',content,t?'Salvar alterações':'Adicionar gasto','expenseForm',true)}
function submitExpense(form){const fd=new FormData(form),amount=toCents(fd.get('amount')),method=isMethod(fd.get('method'))?fd.get('method'):'credit',n=method==='credit'?Number(fd.get('installments')):1,desc=String(fd.get('description')||'').trim(),date=String(fd.get('date')||''),cat=fd.get('category');if(!desc||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(amount)||amount<=0)throw Error('Preencha descrição, data e valor válido.');if(!Number.isInteger(n)||n<1||n>120)throw Error('Informe entre 1 e 120 parcelas.');const items=readItems(),usageRaw=String(fd.get('usage')||'').trim(),usageValue=cat==='contas'&&usageRaw!==''?Number(usageRaw):null;if(usageValue!==null&&(!Number.isFinite(usageValue)||usageValue<0))throw Error('Consumo da fatura inválido.');const tx={id:editingId||makeId(),createdAt:new Date().toISOString(),date,amount,description:desc,merchant:String(fd.get('merchant')||'').trim(),category:cat,subcategory:String(fd.get('subcategory')||''),card:'mine',method,installments:n,notes:String(fd.get('notes')||''),items,receipt:currentReceipt,usageValue,usageUnit:String(fd.get('usageUnit')||'kWh')};if(editingId){const i=data.transactions.findIndex(x=>x.id===editingId);if(i<0)throw Error('Despesa não encontrada.');const prev=data.transactions[i];invalidateBillStatus(prev);tx.createdAt=prev.createdAt;tx.recurringId=prev.recurringId;tx.recurringMonth=prev.recurringMonth;data.transactions[i]=tx}else data.transactions.push(tx);invalidateBillStatus(tx);const wasEditing=!!editingId;save();closeModal();render();notify(wasEditing?'Despesa atualizada.':'Despesa registrada com sucesso.')}

// --- mercado: finalizar compra ---
function checkoutModal(){const picked=marketPicked(),total=sum(picked,x=>Math.round(x.e.qty*x.e.price)),hist=marketHistory(),last=hist.at(-1),shops=[...new Set(hist.map(t=>t.merchant).filter(Boolean))];
 const content=`<div class="form-grid">${field('Data da compra *',`<input class="input" id="expDate" name="date" type="date" value="${localToday()}" required>`,'expDate')}${field('Valor total pago (R$) *',`<input class="input" id="expAmount" name="amount" type="number" min="0.01" step="0.01" placeholder="0,00" value="${total?num(total):''}" required>`,'expAmount',`Soma dos itens marcados: ${money(total)}. Ajuste se o total do caixa foi diferente.`)}${field('Mercado / loja',`<input class="input" id="mkMerchant" name="merchant" list="mkMerchants" maxlength="100" placeholder="Ex.: Assaí" value="${esc(last?.merchant||'')}"><datalist id="mkMerchants">${shops.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>`,'mkMerchant')}${field('Descrição',`<input class="input" id="mkDesc" name="description" maxlength="130" value="Compra de mercado">`,'mkDesc')}${paymentFields(last?{method:last.method}:null)}</div><div class="divider"></div><strong class="subheading">Itens marcados (${picked.length})</strong><div class="statement-list mk-picked">${picked.map(({p,e})=>`<div class="statement-row"><div><strong>${esc(p.name)}</strong><small>${fmtQty(e.qty)} ${esc(p.measure||'un')} × ${e.price?money(e.price):'sem preço'}</small></div><strong>${money(Math.round(e.qty*e.price))}</strong></div>`).join('')}</div>`;
 return modalLayout('Finalizar compra','Os itens marcados viram um lançamento de mercado e alimentam suas tendências.',content,'Registrar compra','checkoutForm',true)}
function submitCheckout(form){const fd=new FormData(form),picked=marketPicked();if(!picked.length)throw Error('Marque ao menos um item da lista.');const amount=toCents(fd.get('amount')),date=String(fd.get('date')||''),method=isMethod(fd.get('method'))?fd.get('method'):'credit',n=method==='credit'?Number(fd.get('installments')):1;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(amount)||amount<=0)throw Error('Informe a data e o valor total pago.');if(!Number.isInteger(n)||n<1||n>120)throw Error('Informe entre 1 e 120 parcelas.');
 const items=picked.map(({p,e})=>({label:p.name,quantity:e.qty,unit:e.price,pid:p.id,measure:p.measure||'un',section:p.section||'Outros'}));
 const tx={id:makeId(),createdAt:new Date().toISOString(),date,amount,description:String(fd.get('description')||'').trim()||'Compra de mercado',merchant:String(fd.get('merchant')||'').trim(),category:'mercado',subcategory:'',card:'mine',method,installments:n,notes:'',items,receipt:'',usageValue:null,usageUnit:'kWh'};
 data.transactions.push(tx);invalidateBillStatus(tx);for(const {p,e} of picked)if(e.price>0)p.price=e.price;data.market.list={};marketFilter={search:'',only:'all'};save();closeModal();render();notify(`Compra registrada: ${money(amount)} em ${items.length} ${items.length===1?'item':'itens'}.`)}

// --- CSV e backup ---
function exportCSV(){const hdr=['id','date','description','amount','category','subcategory','merchant','method','installments','notes','items','usageValue','usageUnit','recurringId','recurringMonth'];const lines=[hdr.join(';'),...data.transactions.map(t=>hdr.map(k=>csvCell(k==='amount'?num(t.amount):k==='items'?JSON.stringify(t.items||[]):k==='method'?methodOf(t):t[k]??'')).join(';'))];downloadFile('﻿'+lines.join('\r\n'),`nexo_despesas_${selectedMonth}.csv`,'text/csv;charset=utf-8');notify('Arquivo CSV preparado.')}
async function importCSV(file){if(!file)return;const content=await file.text(),rows=parseCSV(content),headers=(rows.shift()||[]).map(x=>x.trim());if(!['date','description','amount'].every(x=>headers.includes(x)))throw Error('CSV precisa ter as colunas date, description e amount.');const get=(row,key)=>row[headers.indexOf(key)]??'';let count=0,skipped=0;const sig=t=>`${t.date}|${t.description.toLowerCase()}|${t.amount}`;const seen=new Set(data.transactions.map(sig));
 for(const row of rows){const date=canonicalDate(get(row,'date')),desc=get(row,'description').trim(),share=get(row,'mineShare');let amount=toCents(get(row,'amount'));if(share!==''){const mine=toCents(share);if(Number.isFinite(mine)&&mine>=0)amount=Math.min(amount,mine)}const method=isMethod(get(row,'method'))?get(row,'method'):'credit',n=method==='credit'?Number(get(row,'installments')||1):1;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(amount)||amount<=0||!desc||!Number.isInteger(n)||n<1||n>120){skipped++;continue}const originalCat=get(row,'category'),cat=cats().find(x=>x.id===originalCat||x.name.toLowerCase()===originalCat.toLowerCase())?.id||'outros';let items=[];try{const obj=JSON.parse(get(row,'items')||'[]');if(Array.isArray(obj))items=obj.filter(x=>x&&typeof x.label==='string').map(x=>({label:x.label.slice(0,100),quantity:Number(x.quantity)||1,unit:Number(x.unit)||0,pid:typeof x.pid==='string'?x.pid:'',measure:typeof x.measure==='string'?x.measure.slice(0,8):'',section:typeof x.section==='string'?x.section.slice(0,60):''})).slice(0,200)}catch(e){}
  const tx={id:makeId(),createdAt:new Date().toISOString(),date,amount,description:desc,merchant:get(row,'merchant'),category:cat,subcategory:get(row,'subcategory'),card:'mine',method,installments:n,notes:get(row,'notes'),items,receipt:'',usageValue:get(row,'usageValue')!==''?Number(get(row,'usageValue')):null,usageUnit:get(row,'usageUnit')||'kWh',recurringId:get(row,'recurringId'),recurringMonth:get(row,'recurringMonth')};if(seen.has(sig(tx))){skipped++;continue}data.transactions.push(tx);seen.add(sig(tx));count++}
 save();render();notify(`${count} despesas importadas; ${skipped} ignoradas.`)}
async function importJSON(file){if(!file)return;if(file.size>20*1024*1024)throw Error('Backup acima de 20 MB.');const obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.transactions)||!Array.isArray(obj.salary))throw Error('Este arquivo não parece ser um backup Nexo válido.');const valid=obj.transactions.every(t=>t&&typeof t.id==='string'&&typeof t.date==='string'&&Number.isInteger(t.amount)&&t.amount>0);if(!valid)throw Error('Existem lançamentos inválidos neste backup.');if(!confirm(`Restaurar ${obj.transactions.length} despesas? Isto substitui todos os dados locais atuais. Faça um backup antes de continuar.`))return;localStorage.setItem(STORAGE_KEY,JSON.stringify(obj));data=loadData();if(migratedNow)save();closeModal();render();notify(migratedNow?'Backup restaurado e convertido para somente os seus gastos.':'Backup restaurado.')}

// Eventos de navegação e interação
const content=document.getElementById('content');
document.getElementById('brandMark').innerHTML=icon('activity',21);
document.getElementById('sideHintIcon').innerHTML=icon('trend',19);
document.getElementById('prevMonth').innerHTML=icon('chevLeft',16);
document.getElementById('nextMonth').innerHTML=icon('chevRight',16);
document.getElementById('quickAdd').innerHTML=icon('plus',16)+' Novo gasto';
document.getElementById('mobileMenu').innerHTML=icon('menu',18);
document.getElementById('prevMonth').addEventListener('click',()=>{selectedMonth=monthShift(selectedMonth,-1);animateNext=true;render()});
document.getElementById('nextMonth').addEventListener('click',()=>{selectedMonth=monthShift(selectedMonth,1);animateNext=true;render()});
document.getElementById('quickAdd').addEventListener('click',()=>openModal('expense'));
document.getElementById('themeButton').addEventListener('click',()=>{data.theme=data.theme==='dark'?'light':'dark';save();render()});
document.getElementById('mobileMenu').addEventListener('click',()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('mobileOverlay').classList.add('visible')});
document.getElementById('mobileOverlay').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').classList.remove('visible')});
document.addEventListener('click',ev=>{const nav=ev.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return}const action=ev.target.closest('[data-action]');if(action){handleAction(action.dataset.action,action);return}const modalAction=ev.target.closest('[data-modal-action]');if(modalAction){const a=modalAction.dataset.modalAction;if(a==='close'){closeModal();return}if(a==='add-item'){document.getElementById('itemRows')?.insertAdjacentHTML('beforeend',lineItemRow());return}if(a==='remove-item'){modalAction.closest('.line-item')?.remove();return}if(a==='apply-items'){const items=readItems();if(!items.length){notify('Adicione itens com quantidade e preço.',true);return}const amount=sum(items,x=>Math.round(x.quantity*x.unit));document.getElementById('expAmount').value=num(amount);document.getElementById('itemsSum').textContent=`Itens: ${money(amount)}`;notify('Soma dos itens aplicada ao valor total.');return}if(a==='remove-receipt'){currentReceipt='';document.getElementById('expReceipt').value='';updateReceiptPreview();return}}if(ev.target.id==='backdrop')closeModal()});
document.addEventListener('change',async ev=>{const t=ev.target;if(t.id==='filterCategory'){transFilters.category=t.value;render()}if(t.id==='filterMethod'){transFilters.method=t.value;render()}if(t.name==='method')applyMethodUI();if(t.id==='expCategory'||t.id==='recCat'){const sub=document.getElementById(t.id==='expCategory'?'expSubcat':'recSubcat');if(sub)sub.innerHTML=subOptions(t.value);if(t.id==='expCategory'){const usage=document.getElementById('usageField');if(usage)usage.style.display=t.value==='contas'?'grid':'none'}}if(t.id==='expReceipt'&&t.files?.[0])try{currentReceipt=await compressImage(t.files[0]);updateReceiptPreview();notify('Comprovante anexado.')}catch(e){notify(e.message,true)}if(t.id==='csvFile'&&t.files?.[0])try{await importCSV(t.files[0]);t.value=''}catch(e){notify(e.message,true)}if(t.id==='jsonFile'&&t.files?.[0])try{await importJSON(t.files[0]);t.value=''}catch(e){notify(e.message,true)}});
document.addEventListener('input',ev=>{const t=ev.target;if(handleMarketInput(t))return;if(t.id==='searchExpenses'){const start=t.selectionStart,end=t.selectionEnd;transFilters.search=t.value;render();const search=document.getElementById('searchExpenses');if(search){search.focus();search.setSelectionRange(start,end)}}});
document.addEventListener('submit',ev=>{const form=ev.target;if(form.id==='cardsForm'){ev.preventDefault();for(const c of data.cards){const close=Number(form.elements[`closing_${c.id}`].value),due=Number(form.elements[`due_${c.id}`].value);if(!Number.isInteger(close)||close<1||close>28||!Number.isInteger(due)||due<1||due>28){notify('Os dias precisam estar entre 1 e 28.',true);return}c.closing=close;c.due=due}data.billPaid={};save();render();notify('Datas do cartão atualizadas. As parcelas foram recalculadas e as confirmações de pagamento foram zeradas.');return}if(['expenseForm','recurringForm','incomeForm','categoryForm','checkoutForm','productForm','bulkForm'].includes(form.id)){ev.preventDefault();submitModal(form)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&modalType)closeModal()});
if(migratedNow)save();
render();
if(migratedNow)notify('Agora o painel mostra só os seus gastos. O que era do seu pai saiu das contas e segue guardado no backup.');
</script>
